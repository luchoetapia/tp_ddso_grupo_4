services:
  api:
    build: .
    container_name: express_api_node24
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongodb
    command: npm start

  mongodb:
    image: mongo:7
    container_name: mongodb_container
    logging:
      driver: "none"
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: