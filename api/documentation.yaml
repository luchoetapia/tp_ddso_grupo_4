  /reportes/{id}:
    get:
      summary: Obtiene un reporte con el contenido actual de la entidad reportada
      description: Requiere sesión con rol `admin` (cookie `accessToken`).
      tags: [Reportes]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Reporte encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Reporte"
                  - type: object
                    properties:
                      contenido:
                        type: object
                        nullable: true
                        description: >
                          Campos de texto actuales de la entidad (ej. titulo, descripcion,
                          perfiles[0].titulo). Es null si la entidad fue eliminada.
                        additionalProperties:
                          type: string
                          nullable: true
                        example:
                          titulo: Huerta comunitaria
                          descripcion: Proyecto de color negro
        "400":
          $ref: "#/components/responses/IdInvalido"
        "401":
          description: Falta la sesión o el token es inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario no es admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Reporte no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reportes/{id}/notificar:
    patch:
      summary: Pide al dueño que corrija el contenido reportado
      description: >
        Requiere sesión con rol `admin`. El reporte sigue pendiente y queda marcado como notificado.
        Al dueño le llega un email y lo ve como aviso en la app (GET /colectivos/me/avisosModeracion o
        /colaboradores/me/avisosModeracion). Si edita el contenido y ya no incumple las reglas, el reporte
        pasa a Solucionado solo. Volver a notificar actualiza la fecha y reenvía el aviso.
      tags: [Reportes]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Reporte notificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reporte"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "401":
          description: Falta la sesión o el token es inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario no es admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Reporte no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El reporte ya fue resuelto (no está pendiente)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

