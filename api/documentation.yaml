          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesión no es la cuenta titular del colectivo ni un admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Colectivo inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


