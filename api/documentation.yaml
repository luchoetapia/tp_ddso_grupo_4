          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /colectivos/me/administradores:
    get:
      summary: Lista las cuentas que administran el colectivo de la sesión
      description: >
        Requiere sesión con rol `colectivo`. Devuelve la cuenta titular (la que registró el
        colectivo) y los administradores adicionales. `puedeGestionar` indica si la sesión es
        la titular, única cuenta que puede agregar o quitar administradores.
      tags: [Administradores]
      responses:
        "200":
          description: Equipo administrativo del colectivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  puedeGestionar:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Administrador"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesión no es de un colectivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El usuario no administra ningún colectivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Agrega un administrador al colectivo
      description: >
        Solo la cuenta titular. Crea una cuenta nueva con rol `colectivo` (mismas reglas que el
        registro) y la asocia al colectivo: al ingresar con ella se administra el mismo colectivo
        (proyectos, postulaciones, perfil, etc.). Queda registrado en la auditoría.
      tags: [Administradores]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdministradorInput"
      responses:
        "201":
          description: Administrador agregado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Administrador agregado exitosamente
                  data:
                    $ref: "#/components/schemas/Administrador"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesión no es la cuenta titular del colectivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El username o el email ya están en uso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /colectivos/me/administradores/{idUsuario}:
    delete:
      summary: Quita un administrador del colectivo
      description: >
        Solo la cuenta titular. Quita al administrador y desactiva su cuenta (libera su username
