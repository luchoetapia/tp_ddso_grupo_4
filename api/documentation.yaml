  /colectivos/me:
    get:
      summary: Obtiene el colectivo de la sesión
      description: Requiere sesión con rol `colectivo` (cookie `accessToken`).
      tags: [Colectivos]
      responses:
        "200":
          description: Colectivo del usuario logueado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Colectivo"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesión no es de un colectivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Edita los datos del colectivo de la sesión
      description: >
        Requiere sesión con rol `colectivo` (cookie `accessToken`). Solo se envían los
        campos a modificar (al menos uno). Los proyectos no se editan por acá.
      tags: [Colectivos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nombre:
                  type: string
                  minLength: 1
                descripcion:
                  type: string
                  minLength: 1
                ubicacion:
                  type: string
                  nullable: true
                  maxLength: 100
                  description: Mismas reglas que en ColectivoInput; vacío o null la borra
                tipo:
                  type: string
                  enum: [fundacion, asociacion_barrial, ong, asamblea]
            example:
              descripcion: Asamblea barrial de Villa Urquiza
              ubicacion: Villa Urquiza, CABA
      responses:
        "200":
          description: Colectivo actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Colectivo actualizado exitosamente
                  data:
                    $ref: "#/components/schemas/Colectivo"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesión no es de un colectivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El usuario no tiene colectivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ya existe otro colectivo con ese nombre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /colectivos/me/administradores:
    get:
      summary: Lista las cuentas que administran el colectivo de la sesión
      description: >
        Requiere sesión con rol `colectivo`. Devuelve la cuenta titular (la que registró el
        colectivo) y los administradores adicionales. `puedeGestionar` indica si la sesión es
        la titular, única cuenta que puede agregar o quitar administradores.
      tags: [Administradores]
      responses:
        "200":
          description: Equipo administrativo del colectivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  puedeGestionar:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Administrador"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesión no es de un colectivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El usuario no administra ningún colectivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Agrega un administrador al colectivo
      description: >
        Solo la cuenta titular. Crea una cuenta nueva con rol `colectivo` (mismas reglas que el
        registro) y la asocia al colectivo: al ingresar con ella se administra el mismo colectivo
        (proyectos, postulaciones, perfil, etc.). Queda registrado en la auditoría.
      tags: [Administradores]
