  /colaboradores/me:
    get:
      summary: Obtiene el perfil de la colaboradora de la sesión
      description: Requiere sesión con rol `colaborador`.
      tags: [Colaboradores]
      responses:
        "200":
          description: Perfil de la colaboradora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Colaborador"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesión no es de una colaboradora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El usuario todavía no tiene perfil de colaboradora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Edita el perfil de la colaboradora de la sesión
      description: >
        Requiere sesión con rol `colaborador`. Solo se envían los campos a modificar (al menos uno).
        La cuenta de Git no se puede editar. Los datos personales opcionales aceptan `null` para borrarlos,
        pero tiene que quedar el nombre o el nombre de fantasía. `habilidades` y `contactos` reemplazan
        la lista completa.
      tags: [Colaboradores]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nombre:
                  type: string
                  nullable: true
                  description: Nombre real
                apellido:
                  type: string
                  nullable: true
                  description: Apellido
                nombreFantasia:
                  type: string
                  nullable: true
                  description: Nombre de fantasía (para mantenerse anónima)
                pronombres:
                  type: string
                  nullable: true
                  description: Pronombres
                presentacion:
                  type: string
                  nullable: true
                  description: Presentación (hasta 300 caracteres)
                habilidades:
                  type: array
                  items:
                    $ref: "#/components/schemas/ObjectId"
                deseaSerContactado:
                  type: boolean
                contactos:
                  type: array
                  items:
                    $ref: "#/components/schemas/Contacto"
            example:
              pronombres: ella
              deseaSerContactado: true
              contactos:
                - medio: Email
                  valor: ana@mail.com
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Perfil actualizado exitosamente
                  data:
                    $ref: "#/components/schemas/Colaborador"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesión no es de una colaboradora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Sin perfil de colaboradora o alguna habilidad no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

