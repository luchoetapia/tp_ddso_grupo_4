openapi: 3.0.4
info:
  title: DOCUMENTACION API - TP DDSO Grupo 4
  version: "2.0.0"
  description: >
    Documentación de la API de Código a Voluntad: colectivos, proyectos,
    perfiles, habilidades, colaboradoras/es, colaboraciones, logros y
    notificaciones.


    Para cargar datos de prueba, llamar a los endpoints llenarDatosPrueba en
    este orden: habilidades → proyectos → colectivos → colaboradores.

servers:
  - url: http://localhost:3000

tags:
  - name: Health
    description: Estado del servidor
  - name: Proyectos
    description: Gestión de proyectos
  - name: Logros
    description: Logros/hitos de un proyecto
  - name: Perfiles
    description: Perfiles requeridos por un proyecto (embebidos en él)
  - name: Colectivos
    description: Gestión de colectivos
  - name: Habilidades
    description: Gestión de habilidades
  - name: Colaboradores
    description: Gestión de colaboradoras/es
  - name: Colaboraciones
    description: Participación de colaboradoras/es en proyectos

paths:
  /healthcheck:
    get:
      summary: Verifica que el servidor esté funcionando
      tags: [Health]
      responses:
        "200":
          description: Servidor funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /proyectos:
    get:
      summary: Obtiene todos los proyectos
      tags: [Proyectos]
      responses:
        "200":
          description: Lista de proyectos (con sus perfiles completos)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proyecto"
    post:
      summary: Crea un nuevo proyecto
      description: >
        Los perfiles se envían completos y quedan embebidos en el proyecto.
        Sus habilidades se referencian por id y deben existir previamente
        (ver GET /habilidades). No se permiten campos adicionales a los
        declarados en el schema.
      tags: [Proyectos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProyectoInput"
            examples:
              completo:
                summary: Proyecto con dos perfiles y enlaces
                value:
                  titulo: Huerta comunitaria
                  descripcion: Sitio de inscripciones y cartelería para la huerta del barrio.
                  perfiles:
                    - titulo: Desarrollador/a web
                      descripcion: Formulario de inscripción
                      habilidadesRequeridas: ["665f1c2b3a4d5e6f7a8b9c01"]
                      tipoCompromiso:
                        cantHoras: 5
                        periodo: semanal
                      modalidadColaboracion:
                        incentivoEconomico: 0
                        posibleContratacion: false
                    - titulo: Diseñador/a gráfico/a
                      descripcion: Cartelería de la huerta
                      tipoCompromiso:
                        cantHoras: 10
                        periodo: total
                      modalidadColaboracion: {}
                  enlaceSistema: https://huerta.example.org
                  enlaceCodigoFuente: https://github.com/colectivo/huerta
              minimo:
                summary: Proyecto sin perfiles ni enlaces
                value:
                  titulo: Reciclado de residuos electrónicos
                  descripcion: Registro de puntos de reciclado en la ciudad.
      responses:
        "201":
          description: Proyecto creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Proyecto creado exitosamente
                  data:
                    $ref: "#/components/schemas/Proyecto"
        "400":
          description: Datos inválidos o algún id de habilidad inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Alguna de las habilidades de los perfiles no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ya existe un proyecto con ese título
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proyectos/llenarDatosPrueba:
    post:
      summary: Carga proyectos iniciales
      description: >
        Sin body, crea un proyecto de ejemplo con dos perfiles embebidos
        (Backend Node.js y Diseño UX/UI) sin habilidades. También acepta un
        array de proyectos con el mismo formato que POST /proyectos.
      tags: [Proyectos]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ProyectoInput"
      responses:
        "201":
          description: Proyectos creados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaDatosPrueba"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "409":
          description: Alguno de los proyectos ya existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proyectos/{id}:
    get:
      summary: Obtiene un proyecto por id
      tags: [Proyectos]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Proyecto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proyecto"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          description: Proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proyectos/{id}/finalizar:
    post:
      summary: Finaliza un proyecto
      description: >
        Un colectivo marca el proyecto como finalizado. Un proyecto finalizado
        no admite nuevas personas colaboradoras ni contactos.
      tags: [Proyectos]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idColectivo:
                  $ref: "#/components/schemas/ObjectId"
              required:
                - idColectivo
      responses:
        "200":
          description: Proyecto finalizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Proyecto finalizado exitosamente por el colectivo
                  data:
                    $ref: "#/components/schemas/Proyecto"
        "400":
          description: Falta idColectivo o algún id es inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Colectivo o proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proyectos/{id}/perfiles/{idPerfil}/buscarPotencialesColaboradores:
    get:
      summary: Busca potenciales colaboradoras/es para un perfil del proyecto
      description: >
        Devuelve las colaboradoras que tienen todas las habilidades requeridas
        por el perfil indicado. No incluye los medios de contacto.
      tags: [Proyectos]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdPerfilPath"
      responses:
        "200":
          description: Lista de colaboradoras compatibles (puede ser vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Colaborador"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          description: Proyecto no encontrado, o el perfil no pertenece al proyecto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proyectos/{id}/perfiles/{idPerfil}/contactarColaborador:
    post:
      summary: Contacta a una colaboradora por un perfil del proyecto
      description: >
        Envía un mensaje interno (notificación) a la colaboradora indicada, sólo si
        aceptó ser contactada (deseaSerContactado). La notificación queda registrada
        en la plataforma y además se replica por cada uno de sus medios de contacto
        (Email, WhatsApp, SMS).
      tags: [Proyectos]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdPerfilPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactoInput"
      responses:
        "201":
          description: Colaboradora contactada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Colaborador contactado exitosamente
                  data:
                    $ref: "#/components/schemas/Notificacion"
        "400":
          description: Datos inválidos o id de proyecto inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto o colaboradora no encontrados, o el perfil no pertenece al proyecto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El proyecto está finalizado o la colaboradora no acepta ser contactada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proyectos/{id}/logros:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      summary: Obtiene los logros de un proyecto
      tags: [Logros]
      responses:
        "200":
          description: Lista de logros del proyecto (puede ser vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Logro"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          description: Proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Agrega un logro a un proyecto
      description: No se permiten campos adicionales a los declarados en el schema.
      tags: [Logros]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogroInput"
      responses:
        "201":
          description: Logro creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logro creado exitosamente
                  data:
                    $ref: "#/components/schemas/Logro"
        "400":
          description: Datos inválidos o id de proyecto inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proyectos/{id}/logros/{idLogro}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - $ref: "#/components/parameters/IdLogroPath"
    get:
      summary: Obtiene un logro de un proyecto
      tags: [Logros]
      responses:
        "200":
          description: Logro encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Logro"
        "400":
          description: Id de proyecto o de logro inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto o logro no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Actualiza un logro de un proyecto
      description: >
        Actualización parcial: se pueden enviar sólo los campos a modificar.
        No se permiten campos adicionales a los declarados en el schema.
      tags: [Logros]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogroActualizacion"
      responses:
        "200":
          description: Logro actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logro actualizado exitosamente
                  data:
                    $ref: "#/components/schemas/Logro"
        "400":
          description: Datos inválidos o algún id inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto o logro no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Elimina un logro de un proyecto
      tags: [Logros]
      responses:
        "200":
          description: Logro eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Logro eliminado correctamente
        "400":
          description: Id de proyecto o de logro inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto o logro no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proyectos/{id}/perfiles:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      summary: Obtiene los perfiles de un proyecto
      tags: [Perfiles]
      responses:
        "200":
          description: Lista de perfiles del proyecto (puede ser vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Perfil"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          description: Proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Agrega un perfil a un proyecto
      description: >
        Las habilidades se referencian por id y deben existir previamente
        (ver GET /habilidades). No se permiten campos adicionales a los
        declarados en el schema.
      tags: [Perfiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilInput"
            examples:
              tester:
                summary: Tester sin incentivo económico
                value:
                  titulo: Tester
                  descripcion: Pruebas manuales del formulario
                  habilidadesRequeridas: ["665f1c2b3a4d5e6f7a8b9c01"]
                  habilidadesOpcionales: ["665f1c2b3a4d5e6f7a8b9c02"]
                  tipoCompromiso:
                    cantHoras: 5
                    periodo: mensual
                  modalidadColaboracion:
                    incentivoEconomico: 0
                    posibleContratacion: false
              analista:
                summary: Analista de datos con incentivo económico
                value:
                  titulo: Analista de Datos
                  descripcion: Reportes de inscripciones
                  habilidadesRequeridas: ["665f1c2b3a4d5e6f7a8b9c01"]
                  tipoCompromiso:
                    cantHoras: 15
                    periodo: mensual
                  modalidadColaboracion:
                    incentivoEconomico: 20000
                    posibleContratacion: true
      responses:
        "201":
          description: Perfil creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Perfil creado exitosamente
                  data:
                    $ref: "#/components/schemas/Perfil"
        "400":
          description: Datos inválidos, id de proyecto inválido o algún id de habilidad inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto no encontrado, o alguna de las habilidades no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proyectos/{id}/perfiles/{idPerfil}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - $ref: "#/components/parameters/IdPerfilPath"
    get:
      summary: Obtiene un perfil de un proyecto
      tags: [Perfiles]
      responses:
        "200":
          description: Perfil encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Perfil"
        "400":
          description: Id de proyecto o de perfil inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto no encontrado, o el perfil no pertenece al proyecto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Actualiza un perfil de un proyecto
      description: >
        Actualización parcial: se pueden enviar sólo los campos a modificar.
        No se permiten campos adicionales a los declarados en el schema.
      tags: [Perfiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilActualizacion"
            example:
              descripcion: Tester E2E
              tipoCompromiso:
                cantHoras: 8
                periodo: mensual
      responses:
        "200":
          description: Perfil actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Perfil actualizado exitosamente
                  data:
                    $ref: "#/components/schemas/Perfil"
        "400":
          description: Datos inválidos o algún id inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto o perfil no encontrado, o alguna de las habilidades no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Elimina un perfil de un proyecto
      tags: [Perfiles]
      responses:
        "200":
          description: Perfil eliminado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Perfil eliminado exitosamente
        "400":
          description: Id de proyecto o de perfil inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto o perfil no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /colectivos:
    get:
      summary: Obtiene todos los colectivos
      tags: [Colectivos]
      responses:
        "200":
          description: Lista de colectivos (con sus proyectos completos)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Colectivo"
    post:
      summary: Crea un nuevo colectivo
      description: >
        Los proyectos se referencian por id y deben existir previamente
        (ver GET /proyectos). No se permiten campos adicionales a los
        declarados en el schema.
      tags: [Colectivos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColectivoInput"
            example:
              nombre: Vecinos Autoconvocados
              descripcion: Asamblea barrial de Villa Urquiza
              ubicacion: Villa Urquiza, CABA
              tipo: asamblea
              proyectos: ["665f1c2b3a4d5e6f7a8b9c03"]
      responses:
        "201":
          description: Colectivo creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Colectivo creado exitosamente
                  data:
                    $ref: "#/components/schemas/Colectivo"
        "400":
          description: Datos inválidos o algún id de proyecto inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Alguno de los proyectos no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ya existe un colectivo con ese nombre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /colectivos/llenarDatosPrueba:
    post:
      summary: Carga colectivos iniciales
      description: >
        Sin body, crea dos colectivos de ejemplo sin proyectos. También acepta
        un array de colectivos con el mismo formato que POST /colectivos.
      tags: [Colectivos]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ColectivoInput"
      responses:
        "201":
          description: Colectivos creados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaDatosPrueba"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "409":
          description: Alguno de los colectivos ya existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /colectivos/{id}:
    get:
      summary: Obtiene un colectivo por id
      tags: [Colectivos]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Colectivo encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Colectivo"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          description: Colectivo no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /habilidades:
    get:
      summary: Obtiene todas las habilidades
      tags: [Habilidades]
      responses:
        "200":
          description: Lista de habilidades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habilidad"
    post:
      summary: Crea una nueva habilidad
      description: No se permiten campos adicionales a los declarados en el schema.
      tags: [Habilidades]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabilidadInput"
            examples:
              backend:
                summary: Desarrollo backend (programación)
                value:
                  titulo: Desarrollo backend
                  tipoHabilidad: programacion
                  descripcion: Node.js, bases de datos y APIs REST
              diseño:
                summary: Diseño gráfico
                value:
                  titulo: Diseño gráfico
                  tipoHabilidad: diseño
                  descripcion: Piezas gráficas para difusión de proyectos comunitarios
      responses:
        "201":
          description: Habilidad creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Habilidad creada exitosamente
                  data:
                    $ref: "#/components/schemas/Habilidad"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "409":
          description: Ya existe una habilidad con ese título
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /habilidades/llenarDatosPrueba:
    post:
      summary: Carga habilidades iniciales
      description: >
        Sin body, crea dos habilidades de ejemplo (JavaScript y Node.js).
        También acepta un array de habilidades con el mismo formato que
        POST /habilidades.
      tags: [Habilidades]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/HabilidadInput"
      responses:
        "201":
          description: Habilidades creadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaDatosPrueba"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "409":
          description: Alguna de las habilidades ya existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /habilidades/{id}:
    get:
      summary: Obtiene una habilidad por id
      tags: [Habilidades]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Habilidad encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habilidad"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          description: Habilidad no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /colaboradores:
    get:
      summary: Obtiene todas las colaboradoras/es
      description: No incluye los medios de contacto (son internos).
      tags: [Colaboradores]
      responses:
        "200":
          description: Lista de colaboradoras/es (con sus habilidades completas)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Colaborador"
    post:
      summary: Crea una nueva colaboradora/colaborador
      description: >
        Las habilidades se referencian por id y deben existir previamente
        (ver GET /habilidades). Los medios de contacto se registran
        internamente y no se devuelven en las respuestas. No se permiten
        campos adicionales a los declarados en el schema.
      tags: [Colaboradores]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColaboradorInput"
            examples:
              contactable:
                summary: Colaboradora que acepta ser contactada
                value:
                  nombre: Noelia
                  apellido: Aversa
                  nombreFantasia: noeaversa
                  cuentaGit: noeaversa
                  habilidades: ["665f1c2b3a4d5e6f7a8b9c01"]
                  pronombres: ella
                  presentacion: Desarrolladora full stack con ganas de sumar a proyectos comunitarios.
                  deseaSerContactado: true
                  contactos:
                    - medio: Email
                      valor: noe@mail.com
                    - medio: WhatsApp
                      valor: "+5491112345678"
              minimo:
                summary: Colaborador sin contactos (no acepta ser contactado)
                value:
                  nombre: Facundo
                  apellido: Martínez
                  cuentaGit: facumartinez
                  habilidades: ["665f1c2b3a4d5e6f7a8b9c02"]
      responses:
        "201":
          description: Colaboradora creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Colaboradora creada exitosamente
                  data:
                    $ref: "#/components/schemas/Colaborador"
        "400":
          description: Datos inválidos o algún id de habilidad inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Alguna de las habilidades no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ya existe una colaboradora con esa cuenta de Git
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /colaboradores/llenarDatosPrueba:
    post:
      summary: Carga colaboradoras/es iniciales
      description: >
        Sin body, crea dos personas de ejemplo (juanperez y mariagomez) con
        las habilidades existentes (correr antes POST /habilidades/llenarDatosPrueba).
        También acepta un array con el mismo formato que POST /colaboradores.
      tags: [Colaboradores]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ColaboradorInput"
      responses:
        "201":
          description: Colaboradoras/es creadas/os
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaDatosPrueba"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "409":
          description: Alguna cuenta de Git ya existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /colaboradores/{cuentaGit}:
    get:
      summary: Obtiene una colaboradora/colaborador por cuenta de Git
      tags: [Colaboradores]
      parameters:
        - $ref: "#/components/parameters/CuentaGitPath"
      responses:
        "200":
          description: Colaboradora encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Colaborador"
        "404":
          description: Colaboradora no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /colaboradores/{cuentaGit}/anotarProyecto/{idProyecto}:
    post:
      summary: Anota a una colaboradora/colaborador a un proyecto
      description: >
        Crea una colaboración. La colaboradora debe tener todas las habilidades
        requeridas de al menos un perfil del proyecto, el proyecto no debe
        estar finalizado y no puede estar ya anotada en él.
      tags: [Colaboradores]
      parameters:
        - $ref: "#/components/parameters/CuentaGitPath"
        - in: path
          name: idProyecto
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Colaboradora anotada al proyecto exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Colaboradora anotada al proyecto exitosamente
                  data:
                    $ref: "#/components/schemas/Colaboracion"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          description: Colaboradora o proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El proyecto ya fue finalizado, la colaboradora ya está anotada en él, o no cumple las habilidades requeridas de ningún perfil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /colaboradores/{cuentaGit}/buscarPotencialesProyectos:
    get:
      summary: Busca potenciales proyectos para una colaboradora/colaborador
      description: >
        Devuelve los proyectos no finalizados que tienen al menos un perfil
        cuyas habilidades requeridas posee en su totalidad la colaboradora.
      tags: [Colaboradores]
      parameters:
        - $ref: "#/components/parameters/CuentaGitPath"
      responses:
        "200":
          description: Lista de proyectos compatibles (puede ser vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proyecto"
        "404":
          description: Colaboradora no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /colaboradores/{cuentaGit}/notificaciones:
    get:
      summary: Lista los mensajes internos recibidos por una colaboradora
      description: Devuelve las notificaciones de la colaboradora, de la más reciente a la más antigua.
      tags: [Colaboradores]
      parameters:
        - $ref: "#/components/parameters/CuentaGitPath"
      responses:
        "200":
          description: Lista de notificaciones (puede ser vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notificacion"
        "404":
          description: Colaboradora no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /colaboraciones:
    get:
      summary: Obtiene todas las colaboraciones
      tags: [Colaboraciones]
      responses:
        "200":
          description: Lista de colaboraciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Colaboracion"
    post:
      summary: Crea una colaboración
      description: >
        Equivalente a POST /colaboradores/{cuentaGit}/anotarProyecto/{idProyecto},
        pero recibiendo los ids. Aplica las mismas reglas.
      tags: [Colaboraciones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                idProyecto:
                  $ref: "#/components/schemas/ObjectId"
                idColaborador:
                  $ref: "#/components/schemas/ObjectId"
              required:
                - idProyecto
                - idColaborador
      responses:
        "201":
          description: Colaboración creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Colaboracion creada exitosamente
                  data:
                    $ref: "#/components/schemas/Colaboracion"
        "400":
          description: Datos inválidos o algún id inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Colaboradora o proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El proyecto ya fue finalizado, la colaboradora ya está anotada en él, o no cumple las habilidades requeridas de ningún perfil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
    IdPerfilPath:
      in: path
      name: idPerfil
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
    IdLogroPath:
      in: path
      name: idLogro
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
    CuentaGitPath:
      in: path
      name: cuentaGit
      required: true
      schema:
        type: string
        example: noeaversa

  responses:
    DatosInvalidos:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdInvalido:
      description: El id no tiene formato de ObjectId
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ObjectId:
      type: string
      pattern: "^[0-9a-fA-F]{24}$"
      example: "665f1c2b3a4d5e6f7a8b9c01"

    Timestamps:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        message:
          type: string
        details:
          type: array
          items: {}

    RespuestaDatosPrueba:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: array
          description: Entidades creadas
          items:
            type: object

    TipoCompromiso:
      type: object
      properties:
        cantHoras:
          type: number
          exclusiveMinimum: true
          minimum: 0
          example: 5
        periodo:
          type: string
          enum: [semanal, mensual, total]
          example: mensual
      required:
        - cantHoras
        - periodo

    ModalidadColaboracion:
      type: object
      properties:
        incentivoEconomico:
          type: number
          minimum: 0
          default: 0
          example: 0
        posibleContratacion:
          type: boolean
          default: false
          example: false

    # ---------- Habilidades ----------

    HabilidadInput:
      type: object
      description: Body esperado por POST /habilidades. No admite campos adicionales.
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
        tipoHabilidad:
          type: string
          enum: [programacion, diseño, marketing, comunicacion, gestion_proyectos, colaboracion]
        descripcion:
          type: string
          minLength: 1
      required:
        - titulo
        - tipoHabilidad
        - descripcion

    Habilidad:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        titulo:
          type: string
          example: Desarrollo backend
        tipoHabilidad:
          type: string
          enum: [programacion, diseño, marketing, comunicacion, gestion_proyectos, colaboracion]
        descripcion:
          type: string

    HabilidadAnidada:
      description: Habilidad tal como aparece dentro de otra entidad (documento de MongoDB)
      allOf:
        - type: object
          properties:
            _id:
              $ref: "#/components/schemas/ObjectId"
            titulo:
              type: string
            tipoHabilidad:
              type: string
              enum: [programacion, diseño, marketing, comunicacion, gestion_proyectos, colaboracion]
            descripcion:
              type: string
        - $ref: "#/components/schemas/Timestamps"

    # ---------- Perfiles ----------

    PerfilInput:
      type: object
      description: Body esperado por POST /proyectos/{id}/perfiles (y cada perfil de POST /proyectos). No admite campos adicionales.
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
          example: Tester
        descripcion:
          type: string
          minLength: 1
          example: Pruebas manuales del formulario
        habilidadesRequeridas:
          type: array
          description: Ids de habilidades existentes (ver GET /habilidades)
          items:
            $ref: "#/components/schemas/ObjectId"
          default: []
        habilidadesOpcionales:
          type: array
          description: Ids de habilidades existentes (ver GET /habilidades)
          items:
            $ref: "#/components/schemas/ObjectId"
          default: []
        tipoCompromiso:
          $ref: "#/components/schemas/TipoCompromiso"
        modalidadColaboracion:
          $ref: "#/components/schemas/ModalidadColaboracion"
      required:
        - titulo
        - descripcion
        - tipoCompromiso
        - modalidadColaboracion

    PerfilActualizacion:
      type: object
      description: Body esperado por PUT /proyectos/{id}/perfiles/{idPerfil}. Mismos campos que PerfilInput, todos opcionales.
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
        descripcion:
          type: string
          minLength: 1
        habilidadesRequeridas:
          type: array
          items:
            $ref: "#/components/schemas/ObjectId"
        habilidadesOpcionales:
          type: array
          items:
            $ref: "#/components/schemas/ObjectId"
        tipoCompromiso:
          $ref: "#/components/schemas/TipoCompromiso"
        modalidadColaboracion:
          $ref: "#/components/schemas/ModalidadColaboracion"

    Perfil:
      description: Perfil tal como está embebido en un proyecto (las habilidades vienen como ids)
      allOf:
        - type: object
          properties:
            _id:
              $ref: "#/components/schemas/ObjectId"
            titulo:
              type: string
              example: Tester
            descripcion:
              type: string
              example: Pruebas manuales del formulario
            habilidadesRequeridas:
              type: array
              items:
                $ref: "#/components/schemas/ObjectId"
            habilidadesOpcionales:
              type: array
              items:
                $ref: "#/components/schemas/ObjectId"
            tipoCompromiso:
              $ref: "#/components/schemas/TipoCompromiso"
            modalidadColaboracion:
              $ref: "#/components/schemas/ModalidadColaboracion"
        - $ref: "#/components/schemas/Timestamps"

    # ---------- Logros ----------

    LogroInput:
      type: object
      description: Body esperado por POST /proyectos/{id}/logros. No admite campos adicionales.
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
          example: Primera versión publicada
        descripcion:
          type: string
          minLength: 1
          example: Se publicó el formulario de inscripción en producción
      required:
        - titulo
        - descripcion

    LogroActualizacion:
      type: object
      description: Body esperado por PUT /proyectos/{id}/logros/{idLogro}. Todos los campos son opcionales.
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
        descripcion:
          type: string
          minLength: 1

    Logro:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        titulo:
          type: string
          example: Primera versión publicada
        descripcion:
          type: string
          example: Se publicó el formulario de inscripción en producción

    LogroAnidado:
      description: Logro tal como aparece dentro de un proyecto
      allOf:
        - type: object
          properties:
            _id:
              $ref: "#/components/schemas/ObjectId"
            titulo:
              type: string
            descripcion:
              type: string
        - $ref: "#/components/schemas/Timestamps"

    # ---------- Proyectos ----------

    ProyectoInput:
      type: object
      description: Body esperado por POST /proyectos. No admite campos adicionales.
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
          example: Huerta comunitaria
        descripcion:
          type: string
          example: Sitio de inscripciones y cartelería para la huerta del barrio.
        perfiles:
          type: array
          description: Perfiles requeridos, se embeben en el proyecto
          items:
            $ref: "#/components/schemas/PerfilInput"
          default: []
        enlaceSistema:
          type: string
          format: uri
          nullable: true
          description: Enlace al sistema en funcionamiento
          example: https://huerta.example.org
        enlaceCodigoFuente:
          type: string
          format: uri
          nullable: true
          description: Enlace al código fuente público
          example: https://github.com/colectivo/huerta
      required:
        - titulo
        - descripcion

    Proyecto:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        titulo:
          type: string
          example: Huerta comunitaria
        descripcion:
          type: string
        perfiles:
          type: array
          items:
            $ref: "#/components/schemas/Perfil"
        finalizado:
          type: boolean
          default: false
        porcentajeFinalizado:
          type: number
          default: 0
        enlaceSistema:
          type: string
          nullable: true
        enlaceCodigoFuente:
          type: string
          nullable: true
        logros:
          type: array
          items:
            $ref: "#/components/schemas/LogroAnidado"

    ProyectoAnidado:
      description: Proyecto tal como aparece dentro de un colectivo (los perfiles vienen como ids)
      allOf:
        - type: object
          properties:
            _id:
              $ref: "#/components/schemas/ObjectId"
            titulo:
              type: string
            descripcion:
              type: string
            perfiles:
              type: array
              items:
                $ref: "#/components/schemas/ObjectId"
            finalizado:
              type: boolean
            porcentajeFinalizado:
              type: number
            enlaceSistema:
              type: string
              nullable: true
            enlaceCodigoFuente:
              type: string
              nullable: true
            logros:
              type: array
              items:
                $ref: "#/components/schemas/LogroAnidado"
        - $ref: "#/components/schemas/Timestamps"

    # ---------- Colectivos ----------

    ColectivoInput:
      type: object
      description: Body esperado por POST /colectivos. No admite campos adicionales.
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
        descripcion:
          type: string
        ubicacion:
          type: string
          description: '"Argentina", una provincia, CABA o una ciudad/barrio en texto libre'
        tipo:
          type: string
          enum: [fundacion, asociacion_barrial, ong, asamblea]
        proyectos:
          type: array
          description: Ids de proyectos existentes (ver GET /proyectos)
          items:
            $ref: "#/components/schemas/ObjectId"
          default: []
      required:
        - nombre
        - tipo

    Colectivo:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        nombre:
          type: string
        descripcion:
          type: string
        ubicacion:
          type: string
          nullable: true
        tipo:
          type: string
          enum: [fundacion, asociacion_barrial, ong, asamblea]
        proyectos:
          type: array
          items:
            $ref: "#/components/schemas/ProyectoAnidado"

    # ---------- Colaboradores ----------

    Contacto:
      type: object
      properties:
        medio:
          type: string
          enum: [Email, WhatsApp, SMS]
        valor:
          type: string
          minLength: 1
          example: noe@mail.com
      required: [medio, valor]

    ColaboradorInput:
      type: object
      description: Body esperado por POST /colaboradores. No admite campos adicionales.
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          example: Noelia
        apellido:
          type: string
          minLength: 1
          example: Aversa
        nombreFantasia:
          type: string
          example: noeaversa
        cuentaGit:
          type: string
          minLength: 1
          example: noeaversa
        habilidades:
          type: array
          description: Ids de habilidades existentes (ver GET /habilidades)
          items:
            $ref: "#/components/schemas/ObjectId"
          default: []
        pronombres:
          type: string
          example: ella
        presentacion:
          type: string
          maxLength: 300
        deseaSerContactado:
          type: boolean
          default: false
          description: Si acepta recibir mensajes internos de los colectivos
        contactos:
          type: array
          description: Medios de contacto internos (no se muestran públicamente)
          default: []
          items:
            $ref: "#/components/schemas/Contacto"
      required:
        - nombre
        - apellido
        - cuentaGit

    Colaborador:
      type: object
      description: Datos públicos de la colaboradora. Los medios de contacto no se exponen.
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        nombre:
          type: string
        apellido:
          type: string
        nombreFantasia:
          type: string
          nullable: true
        cuentaGit:
          type: string
          example: noeaversa
        habilidades:
          type: array
          items:
            $ref: "#/components/schemas/HabilidadAnidada"
        pronombres:
          type: string
          nullable: true
        presentacion:
          type: string
          maxLength: 300
          nullable: true
        deseaSerContactado:
          type: boolean

    # ---------- Colaboraciones ----------

    Colaboracion:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        colaborador:
          $ref: "#/components/schemas/ObjectId"
        proyecto:
          $ref: "#/components/schemas/ObjectId"
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
          nullable: true
        esAnonima:
          type: boolean
          default: false
          description: Si la contribución figura sin indicar quién la realizó

    # ---------- Notificaciones ----------

    ContactoInput:
      type: object
      description: Body esperado por POST /proyectos/{id}/perfiles/{idPerfil}/contactarColaborador. No admite campos adicionales.
      additionalProperties: false
      properties:
        cuentaGit:
          type: string
          minLength: 1
          description: Cuenta de Git de la colaboradora a contactar
          example: noeaversa
        mensaje:
          type: string
          minLength: 1
          example: Hola! Tu perfil encaja con lo que buscamos, ¿te interesa sumarte?
      required:
        - cuentaGit
        - mensaje

    Notificacion:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        destinatario:
          $ref: "#/components/schemas/ObjectId"
        proyecto:
          type: object
          properties:
            id:
              $ref: "#/components/schemas/ObjectId"
            titulo:
              type: string
        perfil:
          type: object
          properties:
            id:
              $ref: "#/components/schemas/ObjectId"
            descripcion:
              type: string
        mensaje:
          type: string
        fecha:
          type: string
          format: date-time
