openapi: 3.0.4
info:
  title: DOCUMENTACION API - TP DDSO Grupo 4
  version: "2.0.0"
  description: >
    Documentación de la API de Código a Voluntad: colectivos, proyectos,
    perfiles, habilidades, colaboradoras/es, colaboraciones, logros y
    notificaciones.


    Para cargar datos de prueba, llamar a los endpoints llenarDatosPrueba en
    este orden: habilidades → proyectos → colectivos → colaboradores.

servers:
  - url: http://localhost:3000

tags:
  - name: Health
    description: Estado del servidor
  - name: Proyectos
    description: Gestión de proyectos
  - name: Logros
    description: Logros/hitos de un proyecto
  - name: Perfiles
    description: Perfiles requeridos por un proyecto (embebidos en él)
  - name: Colectivos
    description: Gestión de colectivos
  - name: Habilidades
    description: Gestión de habilidades
  - name: Colaboradores
    description: Gestión de colaboradoras/es
  - name: Colaboraciones
    description: Participación de colaboradoras/es en proyectos
  - name: Palabras baneadas
    description: Palabras prohibidas que generan reportes (solo admins)
  - name: Reportes
    description: Revisión de contenido reportado (solo admins)
  - name: Administradores
    description: Cuentas que administran un colectivo (titular + adicionales)
  - name: Auditoría
    description: Trazabilidad de acciones sobre colectivos, proyectos y colaboraciones
  - name: Postulaciones
    description: Postulaciones de colaboradoras a perfiles de proyectos
  - name: Auth
    description: Sesión e ingreso con LinkedIn

paths:
  /healthcheck:
    get:
      summary: Verifica que el servidor esté funcionando
      tags: [Health]
      responses:
        "200":
          description: Servidor funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /auth/linkedin:
    get:
      summary: Inicia el ingreso con LinkedIn (solo colaboradores)
      description: >
        Navegación del navegador (no se llama con Axios). Guarda un `state` aleatorio en la
        cookie httpOnly `linkedinState` (SameSite=Lax, 10 minutos) y redirige a LinkedIn para
        que el usuario inicie sesión y acepte los permisos `openid profile email`.
        Si el servidor no tiene configurado LinkedIn, redirige a `/ingresar?errorLinkedin=<mensaje>`.
      tags: [Auth]
      responses:
        "302":
          description: Redirección a `https://www.linkedin.com/oauth/v2/authorization` (o al login del front con el error)

  /auth/linkedin/callback:
    get:
      summary: Vuelta desde LinkedIn (redirect URI registrada en la app de LinkedIn)
      description: >
        Valida el `state` contra la cookie `linkedinState` (y la borra), canjea el `code` por un
        access token y obtiene los datos del miembro. Luego, según el email (verificado) de LinkedIn:
        si la cuenta ya está vinculada inicia sesión; si existe un colaborador con ese email le vincula
        LinkedIn; si no existe crea un colaborador sin contraseña con username generado desde el email.
        Deja la sesión en las cookies `accessToken`/`refreshToken`, igual que el login.
        Todas las respuestas son redirecciones al front.
      tags: [Auth]
      parameters:
        - in: query
          name: code
          schema:
            type: string
          description: Código de autorización que envía LinkedIn
        - in: query
          name: state
          schema:
            type: string
          description: Debe coincidir con la cookie `linkedinState`
        - in: query
          name: error
          schema:
            type: string
            example: user_cancelled_login
          description: Lo envía LinkedIn si el usuario canceló
      responses:
        "302":
          description: >
            `/colaboradoras/inicio` si ya tiene perfil de colaborador;
            `/registro?origen=linkedin` si tiene que completarlo;
            `/ingresar?errorLinkedin=<mensaje>` ante cualquier error (cancelación, state inválido,
            email no verificado, la cuenta es de un colectivo, LinkedIn no responde, etc.)

  /proyectos:
    get:
      summary: Obtiene los proyectos (paginado)
      description: >
        Si se envía `texto`, devuelve solo los proyectos cuyo título o
        descripción lo contengan (sin distinguir mayúsculas).
      tags: [Proyectos]
      parameters:
        - in: query
          name: texto
          required: false
          schema:
            type: string
          description: Texto a buscar en el título o la descripción del proyecto
          example: aula
        - $ref: "#/components/parameters/PaginaQuery"
        - $ref: "#/components/parameters/LimiteQuery"
      responses:
        "200":
          description: Página de proyectos (con sus perfiles completos), los más recientes primero
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Proyecto"
                  paginacion:
                    $ref: "#/components/schemas/Paginacion"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
    post:
      summary: Crea un nuevo proyecto
      description: >
        Los perfiles se envían completos y quedan embebidos en el proyecto.
        Sus habilidades se referencian por id y deben existir previamente
        (ver GET /habilidades). No se permiten campos adicionales a los
        declarados en el schema.
      tags: [Proyectos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProyectoInput"
            examples:
              completo:
                summary: Proyecto con dos perfiles y enlaces
                value:
                  titulo: Huerta comunitaria
                  descripcion: Sitio de inscripciones y cartelería para la huerta del barrio.
                  perfiles:
                    - titulo: Desarrollador/a web
                      descripcion: Formulario de inscripción
                      habilidadesRequeridas: ["665f1c2b3a4d5e6f7a8b9c01"]
                      tipoCompromiso:
                        cantHoras: 5
                        periodo: semanal
                      modalidadColaboracion:
                        incentivoEconomico: 0
                        posibleContratacion: false
                    - titulo: Diseñador/a gráfico/a
                      descripcion: Cartelería de la huerta
                      tipoCompromiso:
                        cantHoras: 10
                        periodo: total
                      modalidadColaboracion: {}
                  enlaceSistema: https://huerta.example.org
                  enlaceCodigoFuente: https://github.com/colectivo/huerta
              minimo:
                summary: Proyecto sin perfiles ni enlaces
                value:
                  titulo: Reciclado de residuos electrónicos
                  descripcion: Registro de puntos de reciclado en la ciudad.
      responses:
        "201":
          description: Proyecto creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Proyecto creado exitosamente
                  data:
                    $ref: "#/components/schemas/Proyecto"
        "400":
          description: Datos inválidos o algún id de habilidad inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Alguna de las habilidades de los perfiles no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ya existe un proyecto con ese título
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proyectos/llenarDatosPrueba:
    post:
      summary: Carga proyectos iniciales
      description: >
        Sin body, crea un proyecto de ejemplo con dos perfiles embebidos
        (Backend Node.js y Diseño UX/UI) sin habilidades. También acepta un
        array de proyectos con el mismo formato que POST /proyectos.
      tags: [Proyectos]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ProyectoInput"
      responses:
        "201":
          description: Proyectos creados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaDatosPrueba"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "409":
          description: Alguno de los proyectos ya existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario no es admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /proyectos/{id}:
    get:
      summary: Obtiene un proyecto por id
      tags: [Proyectos]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Proyecto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proyecto"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          description: Proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Edita los datos de un proyecto
      description: >
        Requiere sesión con rol `colectivo` (cookie `accessToken`) y que el proyecto sea de su colectivo.
        Solo se envían los campos a modificar (al menos uno). Los perfiles se editan con
        /proyectos/{id}/perfiles. Un proyecto finalizado no se puede editar.
      tags: [Proyectos]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                titulo:
                  type: string
                  minLength: 1
                descripcion:
                  type: string
                  minLength: 1
                enlaceSistema:
                  type: string
                  format: uri
                  nullable: true
                enlaceCodigoFuente:
                  type: string
                  format: uri
                  nullable: true
                estrategiaAceptacion:
                  type: string
                  enum: [RevisionManual, TodoSuma, HastaLlenarVacantes]
                porcentajeFinalizado:
                  type: number
                  minimum: 0
                  maximum: 100
                  description: Porcentaje de concreción del proyecto
            example:
              descripcion: Plataforma de aulas virtuales para el barrio
              enlaceCodigoFuente: https://github.com/colectivo/aula
      responses:
        "200":
          description: Proyecto actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Proyecto actualizado exitosamente
                  data:
                    $ref: "#/components/schemas/Proyecto"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesión no es de un colectivo o el proyecto no es suyo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Título repetido, proyecto finalizado o estrategia no aplicable a los perfiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proyectos/{id}/finalizar:
    post:
      summary: Finaliza un proyecto
      description: >
        Requiere sesión con rol `colectivo`, del colectivo dueño del proyecto (titular o
        administrador adicional). Un proyecto finalizado no admite nuevas personas colaboradoras ni contactos.
      tags: [Proyectos]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                idColectivo:
                  allOf:
                    - $ref: "#/components/schemas/ObjectId"
                  description: Opcional y se ignora (el colectivo sale de la sesión)
      responses:
        "200":
          description: Proyecto finalizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Proyecto finalizado exitosamente por el colectivo
                  data:
                    $ref: "#/components/schemas/Proyecto"
        "400":
          description: Falta idColectivo o algún id es inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Colectivo o proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesión no es del colectivo dueño del proyecto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /proyectos/{id}/perfiles/{idPerfil}/buscarPotencialesColaboradores:
    get:
      summary: Busca potenciales colaboradoras/es para un perfil del proyecto
      description: >
        Devuelve las colaboradoras que tienen todas las habilidades requeridas
        por el perfil indicado. No incluye los medios de contacto.
      tags: [Proyectos]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdPerfilPath"
        - $ref: "#/components/parameters/PaginaQuery"
        - $ref: "#/components/parameters/LimiteQuery"
      responses:
        "200":
          description: Página de colaboradoras compatibles (puede ser vacía), ordenadas por cuenta de Git
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Colaborador"
                  paginacion:
                    $ref: "#/components/schemas/Paginacion"
        "400":
          description: Id inválido o parámetros de paginación inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto no encontrado, o el perfil no pertenece al proyecto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proyectos/{id}/perfiles/{idPerfil}/contactarColaborador:
    post:
      summary: Contacta a una colaboradora por un perfil del proyecto
      description: >
        Envía un mensaje interno (notificación) a la colaboradora indicada, sólo si
        aceptó ser contactada (deseaSerContactado). La notificación queda registrada
        en la plataforma y además se replica por cada uno de sus medios de contacto
        (Email, WhatsApp, SMS).
      tags: [Proyectos]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdPerfilPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactoInput"
      responses:
        "201":
          description: Colaboradora contactada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Colaborador contactado exitosamente
                  data:
                    $ref: "#/components/schemas/Notificacion"
        "400":
          description: Datos inválidos o id de proyecto inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto o colaboradora no encontrados, o el perfil no pertenece al proyecto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El proyecto está finalizado o la colaboradora no acepta ser contactada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesión no es del colectivo dueño del proyecto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /proyectos/{id}/logros:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      summary: Obtiene los logros de un proyecto
      tags: [Logros]
      responses:
        "200":
          description: Lista de logros del proyecto (puede ser vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Logro"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          description: Proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Agrega un logro a un proyecto
      description: >
        Requiere sesión con rol `colectivo` y que el proyecto sea de su colectivo y esté en curso
        (si no, 401/403/409). No se permiten campos adicionales a los declarados en el schema.
      tags: [Logros]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogroInput"
      responses:
        "201":
          description: Logro creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logro creado exitosamente
                  data:
                    $ref: "#/components/schemas/Logro"
        "400":
          description: Datos inválidos o id de proyecto inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proyectos/{id}/logros/{idLogro}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - $ref: "#/components/parameters/IdLogroPath"
    get:
      summary: Obtiene un logro de un proyecto
      tags: [Logros]
      responses:
        "200":
          description: Logro encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Logro"
        "400":
          description: Id de proyecto o de logro inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto o logro no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Actualiza un logro de un proyecto
      description: >
        Requiere sesión con rol `colectivo` y que el proyecto sea de su colectivo y esté en curso
        (si no, 401/403/409). Actualización parcial: se pueden enviar sólo los campos a modificar.
        No se permiten campos adicionales a los declarados en el schema.
      tags: [Logros]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogroActualizacion"
      responses:
        "200":
          description: Logro actualizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logro actualizado exitosamente
                  data:
                    $ref: "#/components/schemas/Logro"
        "400":
          description: Datos inválidos o algún id inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto o logro no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Elimina un logro de un proyecto
      description: >
        Requiere sesión con rol `colectivo` y que el proyecto sea de su colectivo y esté en curso
        (si no, 401/403/409).
      tags: [Logros]
      responses:
        "200":
          description: Logro eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Logro eliminado correctamente
        "400":
          description: Id de proyecto o de logro inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto o logro no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proyectos/{id}/perfiles:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      summary: Obtiene los perfiles de un proyecto
      tags: [Perfiles]
      responses:
        "200":
          description: Lista de perfiles del proyecto (puede ser vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Perfil"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          description: Proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Agrega un perfil a un proyecto
      description: >
        Las habilidades se referencian por id y deben existir previamente
        (ver GET /habilidades). No se permiten campos adicionales a los
        declarados en el schema.
      tags: [Perfiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfilInput"
            examples:
              tester:
                summary: Tester sin incentivo económico
                value:
                  titulo: Tester
                  descripcion: Pruebas manuales del formulario
                  habilidadesRequeridas: ["665f1c2b3a4d5e6f7a8b9c01"]
                  habilidadesOpcionales: ["665f1c2b3a4d5e6f7a8b9c02"]
                  tipoCompromiso:
                    cantHoras: 5
                    periodo: mensual
                  modalidadColaboracion:
                    incentivoEconomico: 0
                    posibleContratacion: false
              analista:
                summary: Analista de datos con incentivo económico
                value:
                  titulo: Analista de Datos
                  descripcion: Reportes de inscripciones
                  habilidadesRequeridas: ["665f1c2b3a4d5e6f7a8b9c01"]
                  tipoCompromiso:
                    cantHoras: 15
                    periodo: mensual
                  modalidadColaboracion:
                    incentivoEconomico: 20000
                    posibleContratacion: true
      responses:
        "201":
          description: Perfil creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Perfil creado exitosamente
                  data:
                    $ref: "#/components/schemas/Perfil"
        "400":
          description: Datos inválidos, id de proyecto inválido o algún id de habilidad inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto no encontrado, o alguna de las habilidades no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesión no es del colectivo dueño del proyecto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /proyectos/{id}/perfiles/{idPerfil}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - $ref: "#/components/parameters/IdPerfilPath"
    get:
      summary: Obtiene un perfil de un proyecto
      tags: [Perfiles]
      responses:
        "200":
          description: Perfil encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Perfil"
        "400":
          description: Id de proyecto o de perfil inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
