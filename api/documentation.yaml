        - $ref: "#/components/parameters/LimiteQuery"
        - $ref: "#/components/parameters/AccionAuditadaQuery"
        - $ref: "#/components/parameters/TipoEntidadAuditadaQuery"
        - $ref: "#/components/parameters/IdEntidadQuery"
        - in: query
          name: idColectivo
          required: false
          description: Solo las acciones que afectan a este colectivo
          schema:
            $ref: "#/components/schemas/ObjectId"
        - $ref: "#/components/parameters/IdAutorQuery"
        - $ref: "#/components/parameters/DesdeQuery"
        - $ref: "#/components/parameters/HastaQuery"
      responses:
        "200":
          $ref: "#/components/responses/PaginaAuditoria"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          description: Falta la sesión o el token es inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario no es admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /postulaciones:
    post:
      summary: La colaboradora de la sesión se postula a un perfil de un proyecto
      description: >
        Requiere sesión con rol `colaborador`. La postulación siempre queda a nombre de la
        colaboradora de la sesión: si se envía `idColaborador` o `cuentaGit` de otra persona, falla con 403.
        Solo se puede si la búsqueda del perfil está abierta y la colaboradora cumple las habilidades requeridas.
      tags: [Postulaciones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idProyecto, idPerfil]
              properties:
                idProyecto:
                  $ref: "#/components/schemas/ObjectId"
                idPerfil:
                  $ref: "#/components/schemas/ObjectId"
                mensaje:
                  type: string
                  example: Me interesa sumarme al proyecto
      responses:
        "201":
          description: Postulación creada
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesión no es de una colaboradora o intenta postular a otra persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto, perfil o colaboradora inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Búsqueda cerrada, proyecto finalizado, faltan habilidades o ya hay una postulación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /postulaciones/{id}/estado:
    patch:
      summary: Acepta o rechaza una postulación
      description: >
        Requiere sesión con rol `colectivo`, del colectivo dueño del proyecto (titular o administrador adicional).
      tags: [Postulaciones]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  type: string
                  enum: [Aceptada, Rechazada]
      responses:
        "200":
          description: Postulación actualizada
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesión no es del colectivo dueño del proyecto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Postulación inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: La postulación ya fue resuelta, el proyecto está finalizado o se alcanzó el límite del perfil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


components:
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
    IdPerfilPath:
      in: path
      name: idPerfil
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
    IdLogroPath:
      in: path
      name: idLogro
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
    CuentaGitPath:
      in: path
      name: cuentaGit
      required: true
      schema:
        type: string
        example: noeaversa
    PaginaQuery:
      in: query
      name: pagina
      required: false
      description: Número de página (empieza en 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    LimiteQuery:
      in: query
      name: limite
      required: false
      description: Cantidad de elementos por página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

    AccionAuditadaQuery:
      in: query
      name: accion
      required: false
      schema:
        $ref: "#/components/schemas/AccionAuditada"
    TipoEntidadAuditadaQuery:
      in: query
      name: tipoEntidad
      required: false
      schema:
        $ref: "#/components/schemas/TipoEntidadAuditada"
    IdEntidadQuery:
      in: query
      name: idEntidad
      required: false
      description: Solo las acciones sobre esta entidad
      schema:
        $ref: "#/components/schemas/ObjectId"
    IdAutorQuery:
      in: query
      name: idAutor
      required: false
      description: Solo las acciones de este usuario
      schema:
        $ref: "#/components/schemas/ObjectId"
    DesdeQuery:
      in: query
      name: desde
      required: false
      description: Fecha inicial (inclusive)
      schema:
        type: string
        format: date-time
        example: "2026-11-01"
    HastaQuery:
      in: query
      name: hasta
      required: false
      description: Fecha final (inclusive; sin hora incluye todo ese día)
      schema:
        type: string
        format: date-time
        example: "2026-11-23"
  responses:
    PaginaAuditoria:
      description: Página del historial de auditoría
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: "#/components/schemas/RegistroAuditoria"
              paginacion:
                $ref: "#/components/schemas/Paginacion"
    DatosInvalidos:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdInvalido:
      description: El id no tiene formato de ObjectId
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Paginacion:
      type: object
      properties:
        pagina:
          type: integer
          example: 1
        limite:
          type: integer
          example: 10
        total:
          type: integer
          description: Cantidad total de elementos que cumplen el filtro
          example: 23
        totalPaginas:
          type: integer
          example: 3

    PalabraBaneadaInput:
      type: object
      required: [palabra]
      additionalProperties: false
      properties:
        palabra:
          type: string
          minLength: 1
          maxLength: 50
          example: tonto

    PalabraBaneada:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        palabra:
          type: string
          example: tonto
        activa:
          type: boolean
          example: true
        fechaCreacion:
          type: string
          format: date-time

    EstadoReporte:
      type: string
      enum: [Pendiente, Rechazado, Validado, Solucionado]

    TipoEntidadReportada:
      type: string
      enum: [Proyecto, Postulacion, Colaborador, Colectivo]

    ResolucionReporteInput:
      type: object
      additionalProperties: false
      properties:
        comentario:
          type: string
          minLength: 1
          maxLength: 500
          example: En este contexto "negro" se usa como color

    Reporte:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        entidad:
          type: object
          properties:
            tipo:
              $ref: "#/components/schemas/TipoEntidadReportada"
            id:
              $ref: "#/components/schemas/ObjectId"
        motivo:
          type: string
          example: "Palabras prohibidas detectadas en: descripcion (negro)"
        estado:
          $ref: "#/components/schemas/EstadoReporte"
        duenio:
          type: object
          nullable: true
          description: Usuario dueño (solo proyectos y colectivos)
          properties:
            id:
              $ref: "#/components/schemas/ObjectId"
            username:
              type: string
            email:
              type: string
        notificado:
          type: boolean
        fechaNotificacion:
          type: string
          format: date-time
          nullable: true
        fechaSolucion:
          type: string
          format: date-time
          nullable: true
        revisadoPor:
          type: object
          nullable: true
          properties:
            id:
              $ref: "#/components/schemas/ObjectId"
            username:
              type: string
        fechaRevision:
          type: string
          format: date-time
          nullable: true
        comentarioRevision:
          type: string
          nullable: true
        fechaCreacion:
          type: string
          format: date-time

    AccionAuditada:
      type: string
      enum: [colectivo_creado, colectivo_actualizado, colectivo_dado_de_baja, administrador_agregado, administrador_quitado, proyecto_creado, proyecto_actualizado, proyecto_finalizado, perfil_creado, perfil_actualizado, perfil_eliminado, logro_creado, logro_actualizado, logro_eliminado, postulacion_creada, postulacion_aceptada, postulacion_rechazada, colaboracion_creada, colaboracion_dada_de_baja, reporte_notificado, reporte_validado, reporte_rechazado]
    TipoEntidadAuditada:
      type: string
      enum: [Colectivo, Proyecto, Postulacion, Colaboracion, Reporte]
    RegistroAuditoria:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        accion:
          $ref: "#/components/schemas/AccionAuditada"
        entidad:
          type: object
          properties:
            tipo:
              $ref: "#/components/schemas/TipoEntidadAuditada"
            id:
              $ref: "#/components/schemas/ObjectId"
        autor:
          type: object
          nullable: true
          description: Quién hizo la acción (null si fue sin sesión)
          properties:
            id:
              $ref: "#/components/schemas/ObjectId"
            username:
              type: string
              example: ana
            rol:
              type: string
              enum: [admin, colaborador, colectivo]
        idColectivo:
          type: string
          nullable: true
          description: Colectivo afectado por la acción
          example: 507f1f77bcf86cd799439051
        detalle:
          type: string
          nullable: true
          example: "Campos modificados: titulo, descripcion"
        fecha:
          type: string
          format: date-time
    AdministradorInput:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          example: maria-huerta
        email:
          type: string
          format: email
          example: maria@huerta.org
        password:
          type: string
          minLength: 8
          example: unaClaveSegura
    Administrador:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        username:
          type: string
          example: maria-huerta
        email:
          type: string
          example: maria@huerta.org
        esTitular:
          type: boolean
          description: Si es la cuenta que registró el colectivo
    ObjectId:
      type: string
      pattern: "^[0-9a-fA-F]{24}$"
      example: "665f1c2b3a4d5e6f7a8b9c01"

    Timestamps:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        message:
          type: string
        details:
          type: array
          items: {}

    RespuestaDatosPrueba:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: array
          description: Entidades creadas
          items:
            type: object

    TipoCompromiso:
      type: object
      properties:
        cantHoras:
          type: number
          exclusiveMinimum: true
          minimum: 0
          example: 5
        periodo:
          type: string
          enum: [semanal, mensual, total]
          example: mensual
      required:
        - cantHoras
        - periodo

    ModalidadColaboracion:
      type: object
      properties:
        incentivoEconomico:
          type: number
          minimum: 0
          default: 0
          example: 0
        posibleContratacion:
          type: boolean
          default: false
          example: false

    # ---------- Habilidades ----------

    HabilidadInput:
      type: object
      description: Body esperado por POST /habilidades. No admite campos adicionales.
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
        tipoHabilidad:
          type: string
          enum: [programacion, diseño, marketing, comunicacion, gestion_proyectos, colaboracion]
        descripcion:
          type: string
          minLength: 1
      required:
        - titulo
        - tipoHabilidad
        - descripcion

    Habilidad:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        titulo:
          type: string
          example: Desarrollo backend
        tipoHabilidad:
          type: string
          enum: [programacion, diseño, marketing, comunicacion, gestion_proyectos, colaboracion]
        descripcion:
          type: string

    HabilidadAnidada:
      description: Habilidad tal como aparece dentro de otra entidad (documento de MongoDB)
      allOf:
        - type: object
          properties:
            _id:
              $ref: "#/components/schemas/ObjectId"
            titulo:
              type: string
            tipoHabilidad:
              type: string
              enum: [programacion, diseño, marketing, comunicacion, gestion_proyectos, colaboracion]
            descripcion:
              type: string
        - $ref: "#/components/schemas/Timestamps"

    # ---------- Perfiles ----------

    PerfilInput:
      type: object
      description: Body esperado por POST /proyectos/{id}/perfiles (y cada perfil de POST /proyectos). No admite campos adicionales.
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
          example: Tester
        descripcion:
          type: string
          minLength: 1
          example: Pruebas manuales del formulario
        habilidadesRequeridas:
          type: array
          description: Ids de habilidades existentes (ver GET /habilidades)
          items:
            $ref: "#/components/schemas/ObjectId"
          default: []
        habilidadesOpcionales:
          type: array
          description: Ids de habilidades existentes (ver GET /habilidades)
          items:
            $ref: "#/components/schemas/ObjectId"
          default: []
        tipoCompromiso:
          $ref: "#/components/schemas/TipoCompromiso"
        modalidadColaboracion:
          $ref: "#/components/schemas/ModalidadColaboracion"
      required:
        - titulo
        - descripcion
        - tipoCompromiso
        - modalidadColaboracion

    PerfilActualizacion:
      type: object
      description: Body esperado por PUT /proyectos/{id}/perfiles/{idPerfil}. Mismos campos que PerfilInput, todos opcionales.
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
        descripcion:
          type: string
          minLength: 1
        habilidadesRequeridas:
          type: array
          items:
            $ref: "#/components/schemas/ObjectId"
        habilidadesOpcionales:
          type: array
          items:
            $ref: "#/components/schemas/ObjectId"
        tipoCompromiso:
          $ref: "#/components/schemas/TipoCompromiso"
        modalidadColaboracion:
          $ref: "#/components/schemas/ModalidadColaboracion"

    Perfil:
      description: Perfil tal como está embebido en un proyecto (las habilidades vienen como ids)
      allOf:
        - type: object
          properties:
            _id:
              $ref: "#/components/schemas/ObjectId"
            titulo:
              type: string
              example: Tester
            descripcion:
              type: string
              example: Pruebas manuales del formulario
            habilidadesRequeridas:
              type: array
              items:
                $ref: "#/components/schemas/ObjectId"
            habilidadesOpcionales:
              type: array
              items:
                $ref: "#/components/schemas/ObjectId"
            tipoCompromiso:
              $ref: "#/components/schemas/TipoCompromiso"
            modalidadColaboracion:
              $ref: "#/components/schemas/ModalidadColaboracion"
        - $ref: "#/components/schemas/Timestamps"

    # ---------- Logros ----------

    LogroInput:
      type: object
      description: Body esperado por POST /proyectos/{id}/logros. No admite campos adicionales.
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
          example: Primera versión publicada
        descripcion:
          type: string
          minLength: 1
          example: Se publicó el formulario de inscripción en producción
      required:
        - titulo
        - descripcion

    LogroActualizacion:
      type: object
      description: Body esperado por PUT /proyectos/{id}/logros/{idLogro}. Todos los campos son opcionales.
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
        descripcion:
          type: string
          minLength: 1

    Logro:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        titulo:
          type: string
          example: Primera versión publicada
        descripcion:
          type: string
          example: Se publicó el formulario de inscripción en producción
        fecha:
          type: string
          format: date-time
          description: Cuándo se cargó el logro

    LogroAnidado:
      description: Logro tal como aparece dentro de un proyecto
      allOf:
        - type: object
          properties:
            _id:
              $ref: "#/components/schemas/ObjectId"
            titulo:
              type: string
            descripcion:
              type: string
        - $ref: "#/components/schemas/Timestamps"

    # ---------- Proyectos ----------

    ProyectoInput:
      type: object
      description: Body esperado por POST /proyectos. No admite campos adicionales.
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
          example: Huerta comunitaria
        descripcion:
          type: string
          example: Sitio de inscripciones y cartelería para la huerta del barrio.
        perfiles:
          type: array
          description: Perfiles requeridos, se embeben en el proyecto
          items:
            $ref: "#/components/schemas/PerfilInput"
          default: []
        enlaceSistema:
          type: string
          format: uri
          nullable: true
          description: Enlace al sistema en funcionamiento
          example: https://huerta.example.org
        enlaceCodigoFuente:
          type: string
          format: uri
          nullable: true
          description: Enlace al código fuente público
          example: https://github.com/colectivo/huerta
      required:
        - titulo
        - descripcion

    Proyecto:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        titulo:
          type: string
          example: Huerta comunitaria
        descripcion:
          type: string
        perfiles:
          type: array
          items:
            $ref: "#/components/schemas/Perfil"
        finalizado:
          type: boolean
          default: false
        porcentajeFinalizado:
          type: number
          default: 0
        enlaceSistema:
          type: string
          nullable: true
        enlaceCodigoFuente:
          type: string
          nullable: true
        logros:
          type: array
          items:
            $ref: "#/components/schemas/LogroAnidado"

    ProyectoAnidado:
      description: Proyecto tal como aparece dentro de un colectivo (los perfiles vienen como ids)
      allOf:
        - type: object
          properties:
            _id:
              $ref: "#/components/schemas/ObjectId"
            titulo:
              type: string
            descripcion:
              type: string
            perfiles:
              type: array
              items:
                $ref: "#/components/schemas/ObjectId"
            finalizado:
              type: boolean
            porcentajeFinalizado:
              type: number
            enlaceSistema:
              type: string
              nullable: true
            enlaceCodigoFuente:
              type: string
              nullable: true
            logros:
              type: array
              items:
                $ref: "#/components/schemas/LogroAnidado"
        - $ref: "#/components/schemas/Timestamps"

    # ---------- Colectivos ----------

    ColectivoInput:
      type: object
      description: Body esperado por POST /colectivos. No admite campos adicionales.
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
        descripcion:
          type: string
        ubicacion:
          type: string
          description: '"Argentina", una provincia, CABA o una ciudad/barrio en texto libre'
        tipo:
          type: string
          enum: [fundacion, asociacion_barrial, ong, asamblea]
        proyectos:
          type: array
          description: Ids de proyectos existentes (ver GET /proyectos)
          items:
            $ref: "#/components/schemas/ObjectId"
          default: []
      required:
        - nombre
        - tipo

    Colectivo:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        nombre:
          type: string
        descripcion:
          type: string
        ubicacion:
          type: string
          nullable: true
        tipo:
          type: string
          enum: [fundacion, asociacion_barrial, ong, asamblea]
        proyectos:
          type: array
          items:
            $ref: "#/components/schemas/ProyectoAnidado"

    # ---------- Colaboradores ----------

    Contacto:
      type: object
      properties:
        medio:
          type: string
          enum: [Email, WhatsApp, SMS]
        valor:
          type: string
          minLength: 1
          example: noe@mail.com
      required: [medio, valor]

    ColaboradorInput:
      type: object
      description: Body esperado por POST /colaboradores. No admite campos adicionales.
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          example: Noelia
        apellido:
          type: string
          minLength: 1
          example: Aversa
        nombreFantasia:
          type: string
          example: noeaversa
        cuentaGit:
          type: string
          minLength: 1
          example: noeaversa
        habilidades:
          type: array
          description: Ids de habilidades existentes (ver GET /habilidades)
          items:
            $ref: "#/components/schemas/ObjectId"
          default: []
        pronombres:
          type: string
          example: ella
        presentacion:
          type: string
          maxLength: 300
        deseaSerContactado:
          type: boolean
          default: false
          description: Si acepta recibir mensajes internos de los colectivos
        contactos:
          type: array
          description: Medios de contacto internos (no se muestran públicamente)
          default: []
          items:
            $ref: "#/components/schemas/Contacto"
      required:
        - nombre
        - apellido
        - cuentaGit

    Colaborador:
      type: object
      description: Datos públicos de la colaboradora. Los medios de contacto no se exponen.
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        nombre:
          type: string
        apellido:
          type: string
        nombreFantasia:
          type: string
          nullable: true
        cuentaGit:
          type: string
          example: noeaversa
        habilidades:
          type: array
          items:
            $ref: "#/components/schemas/HabilidadAnidada"
        pronombres:
          type: string
          nullable: true
        presentacion:
          type: string
          maxLength: 300
          nullable: true
        deseaSerContactado:
          type: boolean

    # ---------- Colaboraciones ----------

    Colaboracion:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        colaborador:
          type: object
          nullable: true
          description: Quién colabora (null si la colaboración es anónima)
          properties:
            nombre:
              type: string
              nullable: true
            apellido:
              type: string
              nullable: true
            nombreFantasia:
              type: string
              nullable: true
            cuentaGit:
              type: string
              nullable: true
        proyecto:
          type: object
          properties:
            id:
              $ref: "#/components/schemas/ObjectId"
            titulo:
              type: string
        idPerfil:
          allOf:
            - $ref: "#/components/schemas/ObjectId"
          description: Perfil del proyecto que ocupa la colaboración
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
          nullable: true
        activa:
          type: boolean
          description: true mientras no tenga fecha de fin (no se dio de baja)
        esAnonima:
          type: boolean
          default: false
          description: Si la contribución figura sin indicar quién la realizó

    # ---------- Notificaciones ----------

    ContactoInput:
      type: object
      description: Body esperado por POST /proyectos/{id}/perfiles/{idPerfil}/contactarColaborador. No admite campos adicionales.
      additionalProperties: false
      properties:
        cuentaGit:
          type: string
          minLength: 1
          description: Cuenta de Git de la colaboradora a contactar
          example: noeaversa
        mensaje:
          type: string
          minLength: 1
          example: Hola! Tu perfil encaja con lo que buscamos, ¿te interesa sumarte?
      required:
        - cuentaGit
        - mensaje

    Notificacion:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        destinatario:
          $ref: "#/components/schemas/ObjectId"
        proyecto:
          type: object
          properties:
            id:
              $ref: "#/components/schemas/ObjectId"
            titulo:
              type: string
        perfil:
          type: object
          properties:
            id:
              $ref: "#/components/schemas/ObjectId"
            descripcion:
              type: string
        mensaje:
          type: string
        fecha:
          type: string
          format: date-time
