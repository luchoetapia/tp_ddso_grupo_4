openapi: 3.0.4
info:
  title: DOCUMENTACION API - TP DDSO Grupo 4
  version: "2.0.0"
  description: >
    Documentación de la API de Código a Voluntad: colectivos, proyectos,
    perfiles, habilidades, colaboradoras/es, colaboraciones, logros y
    notificaciones.


    Para cargar datos de prueba, llamar a los endpoints llenarDatosPrueba en
    este orden: habilidades → proyectos → colectivos → colaboradores.

servers:
  - url: http://localhost:3000

tags:
  - name: Health
    description: Estado del servidor
  - name: Proyectos
    description: Gestión de proyectos
  - name: Logros
    description: Logros/hitos de un proyecto
  - name: Perfiles
    description: Perfiles requeridos por un proyecto (embebidos en él)
  - name: Colectivos
    description: Gestión de colectivos
  - name: Habilidades
    description: Gestión de habilidades
  - name: Colaboradores
    description: Gestión de colaboradoras/es
  - name: Colaboraciones
    description: Participación de colaboradoras/es en proyectos
  - name: Palabras baneadas
    description: Palabras prohibidas que generan reportes (solo admins)
  - name: Reportes
    description: >
      Moderación (solo admins). Al crear o editar proyectos, organizaciones, colaboradoras y postulaciones
      se corren reglas automáticas (palabras prohibidas, fin de lucro, código cerrado). Si alguna se incumple
      se genera un reporte pendiente y se avisa a los administradores para su revisión manual.
  - name: Administradores
    description: Cuentas que administran un colectivo (titular + adicionales)
  - name: Auditoría
    description: Trazabilidad de acciones sobre colectivos, proyectos y colaboraciones
  - name: Postulaciones
    description: Postulaciones de colaboradoras a perfiles de proyectos
  - name: Home
    description: Datos públicos de la pantalla de inicio (estadísticas con Aggregation Framework y destacados)
  - name: Notificaciones
    description: Mensajes internos del usuario de la sesión
  - name: Auth
    description: >
      Registro, login y sesión. El login y el registro dejan las cookies httpOnly `accessToken` (15 min)
      y `refreshToken` (7 días). Para probar desde Swagger: ejecutar `/auth/login` (el navegador guarda
      las cookies) o pegar el access token en Authorize (`bearerAuth`).
  - name: LinkedIn
    description: Publicaciones en LinkedIn de colaboradores

paths:
  /healthcheck:
    get:
      summary: Verifica que el servidor esté funcionando
      tags: [Health]
      responses:
        "200":
          description: Servidor funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /home/contadores:
    get:
      summary: Estadísticas globales de la plataforma
      description: Calculadas con el Aggregation Framework de MongoDB sobre proyectos, colectivos y colaboraciones.
      tags: [Home]
      responses:
        "200":
          description: Contadores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContadoresHome"

  /home/rankingHabilidades:
    get:
      summary: Top 5 de habilidades más pedidas en proyectos activos
      description: Cuenta en cuántos proyectos activos aparece cada habilidad (requerida u opcional, en cualquier perfil).
      tags: [Home]
      responses:
        "200":
          description: Ranking, de la más pedida a la menos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      $ref: "#/components/schemas/ObjectId"
                    titulo:
                      type: string
                      example: React
                    proyectos:
                      type: integer
                      example: 4

  /home/destacados:
    get:
      summary: Proyectos destacados del inicio
      description: >
        Entre los proyectos activos creados en los últimos días: el más reciente, el de mayor progreso y el
        que tiene más perfiles. Un proyecto que gana más de una categoría aparece una sola vez. Al pasar
        la ventana de días el proyecto deja de estar destacado (rotación automática).
      tags: [Home]
      responses:
        "200":
          description: Hasta 3 proyectos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proyecto"

  /auth/registro:
    post:
      summary: Registra un usuario colaborador o colectivo e inicia la sesión
      description: >
        Crea solo la cuenta de acceso; después hay que crear el perfil con `POST /colaboradores` o
        `POST /colectivos`. Por esta ruta no se pueden crear admins. Deja las cookies de sesión.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password, email, rol]
              properties:
                username:
                  type: string
                  minLength: 3
                  example: ana-dev
                password:
                  type: string
                  minLength: 8
                  example: clave-segura-123
                email:
                  type: string
                  format: email
                  example: ana@mail.com
                rol:
                  type: string
                  enum: [colaborador, colectivo]
      responses:
        "201":
          description: Usuario creado. Setea las cookies `accessToken` y `refreshToken`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaUsuario"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "409":
          description: El username o el email ya están en uso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      summary: Inicia sesión con username o email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accessKey, password]
              properties:
                accessKey:
                  type: string
                  description: Username o email
                  example: ana-dev
                password:
                  type: string
                  example: clave-segura-123
      responses:
        "200":
          description: Sesión iniciada. Setea las cookies `accessToken` y `refreshToken`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaUsuario"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario está desactivado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/validar:
    get:
      summary: Verifica si un username y un email están disponibles
      description: Lo usa el formulario de registro antes de enviar los datos.
      tags: [Auth]
      parameters:
        - in: query
          name: username
          required: true
          schema:
            type: string
            minLength: 3
        - in: query
          name: email
          required: true
          schema:
            type: string
            format: email
      responses:
        "200":
          description: Ambos disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  disponible:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "409":
          description: El username o el email ya están en uso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/refresh:
    post:
      summary: Renueva la sesión usando la cookie refreshToken
      description: >
        Vuelve a leer el usuario de la base, así se respetan desactivaciones y cambios de rol.
        Si no se puede renovar, borra las cookies.
      tags: [Auth]
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Cookies renovadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaUsuario"
        "401":
          description: Falta el refresh token, es inválido o venció
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario está desactivado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      summary: Cierra la sesión (borra las cookies)
      description: Idempotente, funciona aunque no haya sesión.
      tags: [Auth]
      responses:
        "200":
          description: Sesión cerrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sesión cerrada

  /auth/me:
    get:
      summary: Usuario de la sesión actual
      description: El front no puede leer las cookies httpOnly, así que consulta acá quién está logueado.
      tags: [Auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Usuario de la sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaUsuario"
        "401":
          description: No hay sesión o el token venció
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario está desactivado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/linkedin:
    get:
      summary: Inicia el ingreso con LinkedIn (solo colaboradores)
      description: >
        Navegación del navegador (no se llama con Axios). Guarda un `state` aleatorio (dentro de un JWT
        firmado) en la cookie httpOnly `linkedinState` (SameSite=Lax, 10 minutos) y redirige a LinkedIn para
        que el usuario inicie sesión y acepte los permisos `openid profile email w_member_social`.
        Si el servidor no tiene configurado LinkedIn, redirige a `/ingresar?errorLinkedin=<mensaje>`.
      tags: [Auth]
      responses:
        "302":
          description: Redirección a `https://www.linkedin.com/oauth/v2/authorization` (o al login del front con el error)

  /auth/linkedin/vincular:
    get:
      summary: Conecta LinkedIn a la cuenta del colaborador logueado (para poder publicar)
      description: >
        Navegación del navegador. Requiere sesión de colaborador. Igual que `/auth/linkedin`, pero el
        callback vincula la cuenta de LinkedIn al usuario actual (o renueva el token si ya estaba
        vinculada) en lugar de iniciar sesión. Al terminar vuelve a `volverA` con `?linkedin=vinculado`
        (y `publicar` si vino), o con `?errorLinkedin=<mensaje>`.
      tags: [Auth]
      parameters:
        - in: query
          name: volverA
          schema:
            type: string
            example: /colaboradoras/misPostulaciones
          description: Ruta interna del front a la que volver. Si no es válida se usa `/colaboradoras/datos-personales`
        - in: query
          name: publicar
          schema:
            type: string
          description: Id del proyecto sobre el que se quería publicar (el front reabre el modal al volver)
      responses:
        "302":
          description: Redirección a LinkedIn
        "401":
          description: No hay sesión
        "403":
          description: El usuario no es colaborador

  /auth/linkedin/callback:
    get:
      summary: Vuelta desde LinkedIn (redirect URI registrada en la app de LinkedIn)
      description: >
        Valida el `state` contra la cookie `linkedinState` (y la borra), canjea el `code` por un
        access token y obtiene los datos del miembro. Luego, según el email (verificado) de LinkedIn:
        si la cuenta ya está vinculada inicia sesión; si existe un colaborador con ese email le vincula
        LinkedIn; si no existe crea un colaborador sin contraseña con username generado desde el email.
        Deja la sesión en las cookies `accessToken`/`refreshToken`, igual que el login.
        Si el flujo empezó en `/auth/linkedin/vincular`, en cambio, vincula LinkedIn al usuario que lo
        inició y vuelve a la pantalla de origen. En ambos casos guarda cifrado el token de LinkedIn.
        Todas las respuestas son redirecciones al front.
      tags: [Auth]
      parameters:
        - in: query
          name: code
          schema:
            type: string
          description: Código de autorización que envía LinkedIn
        - in: query
          name: state
          schema:
            type: string
          description: Debe coincidir con la cookie `linkedinState`
        - in: query
          name: error
          schema:
            type: string
            example: user_cancelled_login
          description: Lo envía LinkedIn si el usuario canceló
      responses:
        "302":
          description: >
            `/colaboradoras/inicio` si ya tiene perfil de colaborador;
            `/registro?origen=linkedin` si tiene que completarlo;
            `/ingresar?errorLinkedin=<mensaje>` ante cualquier error (cancelación, state inválido,
            email no verificado, la cuenta es de un colectivo, LinkedIn no responde, etc.)

  /linkedin/publicaciones:
    post:
      summary: Publica en el LinkedIn del colaborador sobre un proyecto en el que colabora
      description: >
        Requiere sesión de colaborador con una colaboración activa en el proyecto. El texto se revisa
        contra las palabras baneadas. Si el usuario no tiene LinkedIn conectado con permiso para
        publicar (o LinkedIn rechaza el token), responde 403 con `details: [{ codigo: LINKEDIN_NO_VINCULADO }]`
        y el front tiene que mandarlo a `/auth/linkedin/vincular`.
      tags: [LinkedIn]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proyectoId, texto]
              properties:
                proyectoId:
                  type: string
                  example: 6650f1c2a1b2c3d4e5f60718
                texto:
                  type: string
                  maxLength: 3000
                  example: Estoy colaborando en este proyecto
      responses:
        "201":
          description: Publicado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      idPublicacion:
                        type: string
                        example: "urn:li:share:7000000000000000000"
                      url:
                        type: string
                        nullable: true
                      proyectoId:
                        type: string
                      colaboracionId:
                        type: string
        "400":
          description: Datos inválidos o el texto tiene palabras baneadas
        "401":
          description: No hay sesión
        "403":
          description: No colabora en el proyecto, o no tiene LinkedIn conectado (`LINKEDIN_NO_VINCULADO`)
        "502":
          description: LinkedIn no respondió o rechazó la publicación

  /linkedin/publicaciones/logros:
    post:
      summary: El colectivo publica en su LinkedIn un logro de uno de sus proyectos
      description: >
        Requiere sesión con rol `colectivo` (titular o administrador). El proyecto tiene que ser del colectivo
        y el logro de ese proyecto. Igual que la publicación de colaboradores: si no tiene LinkedIn conectado
        responde 403 con `details: [{ codigo: LINKEDIN_NO_VINCULADO }]`.
      tags: [LinkedIn]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proyectoId, logroId, texto]
              properties:
                proyectoId:
                  $ref: "#/components/schemas/ObjectId"
                logroId:
                  $ref: "#/components/schemas/ObjectId"
                texto:
                  type: string
                  maxLength: 3000
                  example: ¡Lanzamos la primera versión del sistema de turnos!
      responses:
        "201":
          description: Publicado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      idPublicacion:
                        type: string
                        example: "urn:li:share:7000000000000000000"
                      url:
                        type: string
                        nullable: true
                      proyectoId:
                        type: string
                      logroId:
                        type: string
                      logroTitulo:
                        type: string
                      colectivoId:
                        type: string
        "400":
          description: Datos inválidos o el texto tiene palabras baneadas
        "401":
          description: No hay sesión
        "403":
          description: El proyecto no es del colectivo, o no tiene LinkedIn conectado (`LINKEDIN_NO_VINCULADO`)
        "404":
          description: Proyecto o logro inexistente
        "502":
          description: LinkedIn no respondió o rechazó la publicación

  /proyectos:
    get:
      summary: Obtiene los proyectos (paginado)
      description: >
        Si se envía `texto`, devuelve solo los proyectos cuyo título o
        descripción lo contengan (sin distinguir mayúsculas).
      tags: [Proyectos]
      parameters:
        - in: query
          name: texto
          required: false
          schema:
            type: string
          description: Texto a buscar en el título o la descripción del proyecto
          example: aula
        - $ref: "#/components/parameters/PaginaQuery"
        - $ref: "#/components/parameters/LimiteQuery"
      responses:
        "200":
          description: Página de proyectos (con sus perfiles completos), los más recientes primero
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Proyecto"
                  paginacion:
                    $ref: "#/components/schemas/Paginacion"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
    post:
      summary: Crea un nuevo proyecto
      description: >
        Los perfiles se envían completos y quedan embebidos en el proyecto.
        Sus habilidades se referencian por id y deben existir previamente
        (ver GET /habilidades). No se permiten campos adicionales a los
        declarados en el schema.
      tags: [Proyectos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProyectoInput"
            examples:
              completo:
                summary: Proyecto con dos perfiles y enlaces
                value:
                  titulo: Huerta comunitaria
                  descripcion: Sitio de inscripciones y cartelería para la huerta del barrio.
                  perfiles:
                    - titulo: Desarrollador/a web
                      descripcion: Formulario de inscripción
                      habilidadesRequeridas: ["665f1c2b3a4d5e6f7a8b9c01"]
                      tipoCompromiso:
                        cantHoras: 5
                        periodo: semanal
                      modalidadColaboracion:
                        incentivoEconomico: 0
                        posibleContratacion: false
                    - titulo: Diseñador/a gráfico/a
                      descripcion: Cartelería de la huerta
                      tipoCompromiso:
                        cantHoras: 10
                        periodo: total
                      modalidadColaboracion: {}
                  enlaceSistema: https://huerta.example.org
                  enlaceCodigoFuente: https://github.com/colectivo/huerta
              minimo:
                summary: Proyecto sin perfiles ni enlaces
                value:
                  titulo: Reciclado de residuos electrónicos
                  descripcion: Registro de puntos de reciclado en la ciudad.
      responses:
        "201":
          description: Proyecto creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Proyecto creado exitosamente
                  data:
                    $ref: "#/components/schemas/Proyecto"
        "400":
          description: Datos inválidos o algún id de habilidad inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Alguna de las habilidades de los perfiles no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ya existe un proyecto con ese título
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proyectos/llenarDatosPrueba:
    post:
      summary: Carga proyectos iniciales
      description: >
        Sin body, crea un proyecto de ejemplo con dos perfiles embebidos
        (Backend Node.js y Diseño UX/UI) sin habilidades. También acepta un
        array de proyectos con el mismo formato que POST /proyectos.
      tags: [Proyectos]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ProyectoInput"
      responses:
        "201":
          description: Proyectos creados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaDatosPrueba"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "409":
          description: Alguno de los proyectos ya existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El usuario no es admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /proyectos/{id}:
    get:
      summary: Obtiene un proyecto por id
      tags: [Proyectos]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Proyecto encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Proyecto"
                  - type: object
                    properties:
                      colectivo:
                        type: object
                        nullable: true
                        description: Colectivo al que pertenece el proyecto
                        properties:
                          id:
                            type: string
                          nombre:
                            type: string
                            example: Cooperativa Sur
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          description: Proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Edita los datos de un proyecto
      description: >
        Requiere sesión con rol `colectivo` (cookie `accessToken`) y que el proyecto sea de su colectivo.
        Solo se envían los campos a modificar (al menos uno). Los perfiles se editan con
        /proyectos/{id}/perfiles. Un proyecto finalizado no se puede editar.
      tags: [Proyectos]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                titulo:
                  type: string
                  minLength: 1
                descripcion:
                  type: string
                  minLength: 1
                enlaceSistema:
                  type: string
                  format: uri
                  nullable: true
                enlaceCodigoFuente:
                  type: string
                  format: uri
                  nullable: true
                estrategiaAceptacion:
                  type: string
                  enum: [RevisionManual, TodoSuma, HastaLlenarVacantes]
                porcentajeFinalizado:
                  type: number
                  minimum: 0
                  maximum: 100
                  description: Porcentaje de concreción del proyecto
            example:
              descripcion: Plataforma de aulas virtuales para el barrio
              enlaceCodigoFuente: https://github.com/colectivo/aula
      responses:
        "200":
          description: Proyecto actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Proyecto actualizado exitosamente
                  data:
                    $ref: "#/components/schemas/Proyecto"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesión no es de un colectivo o el proyecto no es suyo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Título repetido, proyecto finalizado o estrategia no aplicable a los perfiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Elimina un proyecto
      description: >
        Requiere sesión con rol `colectivo` (cookie `accessToken`) y que el proyecto sea de su colectivo.
        La baja es definitiva y se puede hacer aunque el proyecto esté finalizado. Si el proyecto tiene
        colaboraciones registradas (activas o terminadas) no se elimina, porque forman parte del historial
        de las colaboradoras: en ese caso hay que finalizarlo. Las postulaciones del proyecto se borran con él.
      tags: [Proyectos]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Proyecto eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Proyecto eliminado exitosamente
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesión no es de un colectivo o el proyecto no es suyo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El proyecto tiene colaboraciones registradas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proyectos/{id}/finalizar:
    post:
      summary: Finaliza un proyecto
      description: >
        Requiere sesión con rol `colectivo`, del colectivo dueño del proyecto (titular o
        administrador adicional). Un proyecto finalizado no admite nuevas personas colaboradoras ni contactos.
      tags: [Proyectos]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                idColectivo:
                  allOf:
                    - $ref: "#/components/schemas/ObjectId"
                  description: Opcional y se ignora (el colectivo sale de la sesión)
      responses:
        "200":
          description: Proyecto finalizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Proyecto finalizado exitosamente por el colectivo
                  data:
                    $ref: "#/components/schemas/Proyecto"
        "400":
          description: Falta idColectivo o algún id es inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Colectivo o proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La sesión no es del colectivo dueño del proyecto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /proyectos/{id}/perfiles/{idPerfil}/buscarPotencialesColaboradores:
