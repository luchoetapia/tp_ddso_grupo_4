        pero tiene que quedar el nombre o el nombre de fantasía. `habilidades` y `contactos` reemplazan
        la lista completa.
      tags: [Colaboradores]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nombre:
                  type: string
                  nullable: true
                  description: Nombre real
                apellido:
                  type: string
                  nullable: true
                  description: Apellido
                nombreFantasia:
                  type: string
                  nullable: true
                  description: Nombre de fantasía (para mantenerse anónima)
                pronombres:
                  type: string
                  nullable: true
                  description: Pronombres
                presentacion:
                  type: string
                  nullable: true
                  description: Presentación (hasta 300 caracteres)
                habilidades:
                  type: array
                  items:
                    $ref: "#/components/schemas/ObjectId"
                deseaSerContactado:
                  type: boolean
                contactos:
                  type: array
                  items:
                    $ref: "#/components/schemas/Contacto"
            example:
              pronombres: ella
              deseaSerContactado: true
              contactos:
                - medio: Email
                  valor: ana@mail.com
      responses:
