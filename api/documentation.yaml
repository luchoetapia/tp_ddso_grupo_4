openapi: 3.0.4
info:
  title: DOCUMENTACION API - TP DDSO Grupo 4
  description: Documentación de la API de proyectos, colectivos, habilidades y colaboradores

servers:
  - url: http://localhost:3000

tags:
  - name: Proyectos
    description: Gestión de proyectos
  - name: Colectivos
    description: Gestión de colectivos
  - name: Habilidades
    description: Gestión de habilidades
  - name: Colaboradores
    description: Gestión de colaboradoras/es
  - name: Colaboraciones
    description: Participación de colaboradoras/es en proyectos
  - name: Perfiles
    description: Perfiles requeridos por los proyectos

paths:
  /proyectos:
    get:
      summary: Obtiene todos los proyectos
      tags: [Proyectos]
      responses:
        "200":
          description: Lista de proyectos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proyecto"
    post:
      summary: Crea un nuevo proyecto
      description: >
        Las habilidades se referencian por id y deben existir previamente
        (crealas primero con POST /habilidades: ver ejemplos "backend" e
        "diseño"). No se permiten campos adicionales a los declarados en el
        schema.
      tags: [Proyectos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProyectoInput"
            examples:
              completo:
                summary: Proyecto que requiere dos habilidades
                value:
                  titulo: Huerta comunitaria
                  descripcion: Espacio verde barrial mantenido por vecinas y vecinos. Requiere quien programe el sitio de inscripciones y quien diseñe la cartelería.
                  habilidades: ["665f1c2b3a4d5e6f7a8b9c01", "665f1c2b3a4d5e6f7a8b9c02"]
                  tipoCompromiso:
                    cantHoras: 4
                    periodo: semanal
                  modalidadColaboracion:
                    incentivoEconomico: 0
                    posibleContratacion: false
              minimo:
                summary: Proyecto sin descripción ni habilidades (solo campos obligatorios)
                value:
                  titulo: Reciclado de residuos electrónicos
                  tipoCompromiso:
                    cantHoras: 10
                    periodo: mensual
                  modalidadColaboracion:
                    incentivoEconomico: 0
                    posibleContratacion: true
      responses:
        "201":
          description: Proyecto creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Proyecto creado exitosamente
                  data:
                    $ref: "#/components/schemas/Proyecto"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "404":
          description: Alguna de las habilidades no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ya existe un proyecto con ese título
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /proyectos/llenarDatosPrueba:
    post:
      summary: Carga proyectos iniciales
      description: >
        Sin body, crea un proyecto de ejemplo con las primeras dos habilidades
        existentes (correr antes POST /habilidades/llenarDatosPrueba). También acepta un
        array de proyectos con el mismo formato que POST /proyectos.
      tags: [Proyectos]
      responses:
        "201":
          description: Proyectos creados
        "409":
          description: Alguno de los proyectos ya existe

  /proyectos/{id}:
    get:
      summary: Obtiene un proyecto por id
      tags: [Proyectos]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Proyecto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proyecto"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          description: Proyecto no encontrado

  /proyectos/{id}/finalizar:
    post:
      summary: Finaliza un proyecto
      description: >
        Un colectivo marca el proyecto como finalizado. Un proyecto finalizado
        no admite nuevas personas colaboradoras.
      tags: [Proyectos]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idColectivo:
                  $ref: "#/components/schemas/ObjectId"
              required:
                - idColectivo
      responses:
        "200":
          description: Proyecto finalizado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Proyecto finalizado exitosamente por el colectivo
                  data:
                    $ref: "#/components/schemas/Proyecto"
        "400":
          description: Falta idColectivo o algún id es inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Colectivo o proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /colectivos:
    get:
      summary: Obtiene todos los colectivos
      tags: [Colectivos]
      responses:
        "200":
          description: Lista de colectivos (con sus proyectos completos)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Colectivo"
    post:
      summary: Crea un nuevo colectivo
      description: >
        Los proyectos se referencian por id y deben existir previamente
        (ver GET /proyectos).
      tags: [Colectivos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColectivoInput"
            example:
              nombre: Vecinos Autoconvocados
              descripcion: Asamblea barrial de Villa Urquiza
              ubicacion: Villa Urquiza, CABA
              tipo: asamblea
              proyectos: ["665f1c2b3a4d5e6f7a8b9c03"]
      responses:
        "201":
          description: Colectivo creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Colectivo creado exitosamente
                  data:
                    $ref: "#/components/schemas/Colectivo"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "404":
          description: Alguno de los proyectos no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ya existe un colectivo con ese nombre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /colectivos/llenarDatosPrueba:
    post:
      summary: Carga colectivos iniciales
      description: >
        Sin body, crea dos colectivos de ejemplo sin proyectos. También acepta
        un array de colectivos con el mismo formato que POST /colectivos.
      tags: [Colectivos]
      responses:
        "201":
          description: Colectivos creados
        "409":
          description: Alguno de los colectivos ya existe

  /colectivos/{id}:
    get:
      summary: Obtiene un colectivo por id
      tags: [Colectivos]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Colectivo encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Colectivo"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          description: Colectivo no encontrado

  /habilidades:
    get:
      summary: Obtiene todas las habilidades
      tags: [Habilidades]
      responses:
        "200":
          description: Lista de habilidades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habilidad"
    post:
      summary: Crea una nueva habilidad
      tags: [Habilidades]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabilidadInput"
            examples:
              backend:
                summary: Desarrollo backend (programación)
                value:
                  titulo: Desarrollo backend
                  tipoHabilidad: programacion
                  descripcion: Node.js, bases de datos y APIs REST
              diseño:
                summary: Diseño gráfico
                value:
                  titulo: Diseño gráfico
                  tipoHabilidad: diseño
                  descripcion: Piezas gráficas para difusión de proyectos comunitarios
      responses:
        "201":
          description: Habilidad creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Habilidad creada exitosamente
                  data:
                    $ref: "#/components/schemas/Habilidad"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "409":
          description: Ya existe una habilidad con ese título
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /habilidades/llenarDatosPrueba:
    post:
      summary: Carga habilidades iniciales
      description: >
        Sin body, crea dos habilidades de ejemplo (JavaScript y Node.js).
        También acepta un array de habilidades con el mismo formato que
        POST /habilidades.
      tags: [Habilidades]
      responses:
        "201":
          description: Habilidades creadas
        "409":
          description: Alguna de las habilidades ya existe

  /habilidades/{id}:
    get:
      summary: Obtiene una habilidad por id
      tags: [Habilidades]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Habilidad encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habilidad"
        "400":
          $ref: "#/components/responses/IdInvalido"
        "404":
          description: Habilidad no encontrada

  /colaboradores:
    get:
      summary: Obtiene todas las colaboradoras/es
      tags: [Colaboradores]
      responses:
        "200":
          description: Lista de colaboradoras/es (con sus habilidades completas)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Colaborador"
    post:
      summary: Crea una nueva colaboradora/colaborador
      description: >
        Las habilidades se referencian por id y deben existir previamente
        (ver GET /habilidades).
      tags: [Colaboradores]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColaboradorInput"
            examples:
              backend:
                summary: Colaboradora con habilidad de programación
                value:
                  nombre: Noelia
                  apellido: Aversa
                  nombreFantasia: noeaversa
                  cuentaGit: noeaversa
                  habilidades: ["665f1c2b3a4d5e6f7a8b9c01"]
                  pronombres: ella
                  presentacion: Desarrolladora full stack con ganas de sumar a proyectos comunitarios.
              diseño:
                summary: Colaborador con habilidad de diseño
                value:
                  nombre: Facundo
                  apellido: Martínez
                  nombreFantasia: facumartinez
                  cuentaGit: facumartinez
                  habilidades: ["665f1c2b3a4d5e6f7a8b9c02"]
                  pronombres: él
                  presentacion: Diseñador gráfico, disponible fines de semana.
      responses:
        "201":
          description: Colaboradora creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Colaboradora creada exitosamente
                  data:
                    $ref: "#/components/schemas/Colaborador"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "404":
          description: Alguna de las habilidades no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ya existe una colaboradora con esa cuenta de Git
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /colaboradores/llenarDatosPrueba:
    post:
      summary: Carga colaboradoras/es iniciales
      description: >
        Sin body, crea dos personas de ejemplo (juanperez y mariagomez) con
        las habilidades existentes (correr antes POST /habilidades/llenarDatosPrueba).
        También acepta un array con el mismo formato que POST /colaboradores.
      tags: [Colaboradores]
      responses:
        "201":
          description: Colaboradoras/es creadas/os
        "409":
          description: Alguna cuenta de Git ya existe

  /colaboradores/{cuentaGit}:
    get:
      summary: Obtiene una colaboradora/colaborador por cuenta de Git
      tags: [Colaboradores]
      parameters:
        - in: path
          name: cuentaGit
          required: true
          schema:
            type: string
            example: noeaversa
      responses:
        "200":
          description: Colaboradora encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Colaborador"
        "404":
          description: Colaboradora no encontrada

  /colaboradores/{cuentaGit}/anotarProyecto/{idProyecto}:
    post:
      summary: Anota a una colaboradora/colaborador a un proyecto
      description: >
        Crea una colaboración. La colaboradora debe tener al menos una
        habilidad en común con las requeridas por el proyecto, el proyecto no
        debe estar finalizado y no puede estar ya anotada en él.
      tags: [Colaboradores]
      parameters:
        - in: path
          name: cuentaGit
          required: true
          schema:
            type: string
            example: noeaversa
        - in: path
          name: idProyecto
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Colaboradora anotada al proyecto exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Colaboradora anotada al proyecto exitosamente
                  data:
                    $ref: "#/components/schemas/Colaboracion"
        "400":
          description: Id de proyecto inválido, o la colaboradora no cuenta con ninguna habilidad requerida por el proyecto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Colaboradora o proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El proyecto ya fue finalizado, o la colaboradora ya está anotada en él
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /colaboraciones:
    get:
      summary: Obtiene todas las colaboraciones
      tags: [Colaboraciones]
      responses:
        "200":
          description: Lista de colaboraciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Colaboracion"
    post:
      summary: Crea una colaboración
      description: >
        Equivalente a POST /colaboradores/{cuentaGit}/anotarProyecto/{idProyecto},
        pero recibiendo los ids. Aplica las mismas reglas.
      tags: [Colaboraciones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idProyecto:
                  $ref: "#/components/schemas/ObjectId"
                idColaborador:
                  $ref: "#/components/schemas/ObjectId"
              required:
                - idProyecto
                - idColaborador
      responses:
        "201":
          description: Colaboración creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Colaboracion creada exitosamente
                  data:
                    $ref: "#/components/schemas/Colaboracion"
        "400":
          description: Datos inválidos, o la colaboradora no cuenta con ninguna habilidad requerida por el proyecto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Colaboradora o proyecto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El proyecto ya fue finalizado, o la colaboradora ya está anotada en él
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /perfiles/llenarDatosPrueba:
    post:
      summary: Carga perfiles iniciales
      description: >
        Sin body, crea dos perfiles de ejemplo (Backend Node.js y Diseño UX/UI)
        sin habilidades. También acepta un array de perfiles con el mismo
        formato que POST /perfiles.
      tags: [Perfiles]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  descripcion:
                    type: string
                    example: Desarrollador Backend Node.js
                  habilidadesRequeridas:
                    type: array
                    items:
                      type: string
                      example: 665f1c2e8b3a4d0012345678
                  habilidadesOpcionales:
                    type: array
                    items:
                      type: string
                  tipoCompromiso:
                    type: object
                    properties:
                      cantHoras:
                        type: number
                        example: 10
                      periodo:
                        type: string
                        enum: [semanal, mensual, total]
                  modalidadColaboracion:
                    type: object
                    properties:
                      incentivoEconomico:
                        type: number
                        example: 0
                      posibleContratacion:
                        type: boolean
                        example: true
      responses:
        "201":
          description: Perfiles creados
        "400":
          description: Datos inválidos o alguna habilidad no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /perfiles/{id}/buscarColaboradoras:
    get:
      summary: Busca potenciales colaboradoras/es para un perfil
      description: >
        Devuelve las colaboradoras que tienen todas las habilidades requeridas
        por el perfil, ordenadas de mayor a menor según cuántas habilidades
        opcionales del perfil tienen. No incluye los medios de contacto.
      tags: [Perfiles]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Lista de colaboradoras compatibles (puede ser vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/Colaborador"
                    - type: object
                      properties:
                        cantHabilidadesOpcionales:
                          type: integer
                          example: 1
        "400":
          description: Id de perfil inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Perfil no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"

  responses:
    DatosInvalidos:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdInvalido:
      description: El id no tiene formato de ObjectId
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ObjectId:
      type: string
      pattern: "^[0-9a-fA-F]{24}$"
      example: "665f1c2b3a4d5e6f7a8b9c01"

    Timestamps:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TipoCompromiso:
      type: object
      properties:
        cantHoras:
          type: number
          example: 4
        periodo:
          type: string
          enum: [semanal, mensual, total]
          example: semanal
      required:
        - cantHoras
        - periodo

    ModalidadColaboracion:
      type: object
      properties:
        incentivoEconomico:
          type: number
          example: 0
        posibleContratacion:
          type: boolean
          example: false
      required:
        - incentivoEconomico
        - posibleContratacion

    ProyectoInput:
      type: object
      description: Body esperado por POST /proyectos. No admite campos adicionales.
      properties:
        titulo:
          type: string
          example: Huerta comunitaria
        descripcion:
          type: string
          example: Espacio verde barrial mantenido por vecinas y vecinos
        habilidades:
          type: array
          description: Ids de habilidades existentes (ver GET /habilidades)
          items:
            $ref: "#/components/schemas/ObjectId"
        tipoCompromiso:
          $ref: "#/components/schemas/TipoCompromiso"
        modalidadColaboracion:
          $ref: "#/components/schemas/ModalidadColaboracion"
      required:
        - titulo
        - tipoCompromiso
        - modalidadColaboracion

    Proyecto:
      allOf:
        - type: object
          properties:
            _id:
              $ref: "#/components/schemas/ObjectId"
            titulo:
              type: string
              example: Huerta comunitaria
            descripcion:
              type: string
            habilidades:
              type: array
              items:
                $ref: "#/components/schemas/Habilidad"
            tipoCompromiso:
              $ref: "#/components/schemas/TipoCompromiso"
            modalidadColaboracion:
              $ref: "#/components/schemas/ModalidadColaboracion"
            finalizado:
              type: boolean
              default: false
            porcentajeFinalizado:
              type: number
              default: 0
            enlaceSistema:
              type: string
              nullable: true
            enlaceCodigoFuente:
              type: string
              nullable: true
            logros:
              type: array
              items:
                type: object
                properties:
                  titulo:
                    type: string
                  descripcion:
                    type: string
        - $ref: "#/components/schemas/Timestamps"

    ColectivoInput:
      type: object
      description: Body esperado por POST /colectivos. No admite campos adicionales.
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        ubicacion:
          type: string
        tipo:
          type: string
          enum: [fundacion, asociacion_barrial, ong, asamblea]
        proyectos:
          type: array
          description: Ids de proyectos existentes (ver GET /proyectos)
          items:
            $ref: "#/components/schemas/ObjectId"
          default: []
      required:
        - nombre
        - tipo

    Colectivo:
      allOf:
        - type: object
          properties:
            _id:
              $ref: "#/components/schemas/ObjectId"
            nombre:
              type: string
            descripcion:
              type: string
            ubicacion:
              type: string
              nullable: true
            tipo:
              type: string
              enum: [fundacion, asociacion_barrial, ong, asamblea]
            proyectos:
              type: array
              items:
                $ref: "#/components/schemas/Proyecto"
        - $ref: "#/components/schemas/Timestamps"

    HabilidadInput:
      type: object
      description: Body esperado por POST /habilidades. No admite campos adicionales.
      properties:
        titulo:
          type: string
        tipoHabilidad:
          type: string
          enum: [programacion, diseño, marketing, comunicacion, gestion_proyectos, colaboracion]
        descripcion:
          type: string
      required:
        - titulo
        - tipoHabilidad
        - descripcion

    Habilidad:
      allOf:
        - type: object
          properties:
            _id:
              $ref: "#/components/schemas/ObjectId"
            titulo:
              type: string
            tipoHabilidad:
              type: string
              enum: [programacion, diseño, marketing, comunicacion, gestion_proyectos, colaboracion]
            descripcion:
              type: string
        - $ref: "#/components/schemas/Timestamps"

    ColaboradorInput:
      type: object
      description: Body esperado por POST /colaboradores. No admite campos adicionales.
      properties:
        nombre:
          type: string
          example: Noelia
        apellido:
          type: string
          example: Aversa
        nombreFantasia:
          type: string
          example: noeaversa
        cuentaGit:
          type: string
          example: noeaversa
        habilidades:
          type: array
          description: Ids de habilidades existentes (ver GET /habilidades)
          items:
            $ref: "#/components/schemas/ObjectId"
          default: []
        pronombres:
          type: string
          example: ella
        presentacion:
          type: string
          maxLength: 300
      required:
        - nombre
        - apellido
        - cuentaGit

    Colaborador:
      allOf:
        - type: object
          properties:
            _id:
              $ref: "#/components/schemas/ObjectId"
            nombre:
              type: string
            apellido:
              type: string
            nombreFantasia:
              type: string
              nullable: true
            cuentaGit:
              type: string
              example: noeaversa
            habilidades:
              type: array
              items:
                $ref: "#/components/schemas/Habilidad"
            pronombres:
              type: string
              nullable: true
            presentacion:
              type: string
              maxLength: 300
              nullable: true
            deseaSerContactado:
              type: boolean
            contactos:
              type: array
              items:
                type: object
                properties:
                  medio:
                    type: string
                    enum: [Email, WhatsApp, SMS]
                  valor:
                    type: string
        - $ref: "#/components/schemas/Timestamps"

    Colaboracion:
      allOf:
        - type: object
          properties:
            _id:
              $ref: "#/components/schemas/ObjectId"
            colaborador:
              type: object
              description: Datos básicos de la colaboradora
              properties:
                _id:
                  $ref: "#/components/schemas/ObjectId"
                nombre:
                  type: string
                apellido:
                  type: string
                nombreFantasia:
                  type: string
                  nullable: true
                cuentaGit:
                  type: string
            proyecto:
              type: object
              description: Datos básicos del proyecto
              properties:
                _id:
                  $ref: "#/components/schemas/ObjectId"
                titulo:
                  type: string
                finalizado:
                  type: boolean
            inicio:
              type: string
              format: date-time
            fin:
              type: string
              format: date-time
              nullable: true
        - $ref: "#/components/schemas/Timestamps"

    Error:
      type: object
      properties:
        message:
          type: string
        details:
          type: array
          items: {}
