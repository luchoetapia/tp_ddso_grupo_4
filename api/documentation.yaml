          description: Página de colectivos (con sus proyectos completos), ordenados por nombre
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Colectivo"
                  paginacion:
                    $ref: "#/components/schemas/Paginacion"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
    post:
      summary: Crea un nuevo colectivo
      description: >
