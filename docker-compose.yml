services:
  api:
    build:
      context: ./api
      dockerfile: dockerfile
    restart: unless-stopped
    env_file:
      - ./api/.env
    # MONGO_URI sale del .env. Para llegar al Mongo del host usar mongodb://host.docker.internal:27017
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthcheck"]
      # El primer minuto chequea cada 5s (así el front arranca apenas la API responde); después cada 5m
      start_period: 60s
      start_interval: 5s
      interval: 5m
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        # Las rewrites /api/* se fijan al compilar; dentro de la red de docker la API se llama "api"
        API_URL: http://api:3000
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      API_URL: http://api:3000
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
